      c.choiceFields = { breed: "Breed", gender: "Gender", rank: "Rank" };
      if (aName) c.choiceFields.groupA = cfg.groupA.label;
      if (bName) c.choiceFields.groupB = cfg.groupB.label;
      c.freeAbilityDots = Object.values({ ...(cfg.free || {}), ...(b.free || {}) }).reduce((s, x) => s + x, 0);
      return c;
    }

    const options = [{ id: "breed", label: "Breed", choices: Object.keys(cfg.breeds) }];
    options.push({ id: "gender", label: "Gender", choices: ["Female", "Male"] });
    if (cfg.groupA) options.push({ id: "groupA", label: cfg.groupA.label, choices: Object.keys(cfg.groupA.choices) });
    if (cfg.groupB) options.push({ id: "groupB", label: cfg.groupB.label, choices: Object.keys(cfg.groupB.choices) });
    options.push(
      { id: "rank", label: "Rank", choices: [1, 2, 3, 4, 5], default: 1, random: false },
      { id: "freebies", label: "Freebie points", type: "number", min: 0, max: 500, default: 15 },
      { id: "meritsFlaws", label: "Merits & Flaws", choices: ["Random", "No"], default: "Random", random: false }
    );
    WOD.registerGame({
      id: cfg.id,
      label: cfg.label,
      options,
      generate,
      recompute(c) {
        c.table.rows = formRows(cfg.forms(c.selection || {}), attrsFromSheet(c), physSocFor);
      },
      cfg,
    });
  }
  const renownFn = (names, need) => renown(names, need);

  // "Starting Gifts: one Level 1 Gift each from ..." for the points box.
  function startHint(cfg, b, a, g2, breed, aName, bName, gender, sel) {
    const where = { breed: breed, groupA: aName, groupB: bName, general: cfg.general ? "General" : null, extra: (cfg.extraSource || [])[1] };
    const lists = { breed: b.start, groupA: a.startBy ? a.startBy[sel.breedIsMetis ? "Metis" : gender] : a.start, groupB: g2.start };
    const parts = cfg.startGifts.filter((k) => where[k]).map((k) => (lists[k] ? `${where[k]} (${lists[k].join(", ")})` : where[k]));
    let text = `One Level 1 Gift from each: ${parts.join("; ")}.`;
    if (new Set(cfg.startGifts).size < cfg.startGifts.length) text = `${cfg.startGifts.length} Level 1 Gifts from: ${[...new Set(parts)].join("; ")}.`;
    if ((a.freeGifts || []).length) text += ` ${a.freeGifts.join(", ")} comes free.`;
    return text;
  }

  return { blank, budget, fillRest, fitPools, traitKind, xpForChange, giftXp, giftLevel, giftSource, costOf, XP_STEP, pickGender, firstName, simpleGame, mergeSets, ATTRIBUTES, ABILITIES, ARCHETYPES, HEALTH, COSTS, pts, G, giftEntries, giftLabel, mfLabel, giftPicker, giftOptions, attributes, abilities, backgrounds, renown, meritsFlaws, spendFreebies, formRows, attrsFromSheet, groupByCost, sheet };
})();

  <script>
/*
  Werewolf: the Apocalypse (classic World of Darkness, Revised rules).

  All game data lives in the DATA object below, so lists can be fixed or
  extended without touching the generator logic.

  SOURCES (checked against the owner's PDFs, October 2026):
    Core = Werewolf: the Apocalypse, Revised Edition (2000)
    WPG  = Werewolf Players Guide (2nd edition, 1993)
    CoG  = Tribebook: Children of Gaia (Revised)
    GW   = Tribebook: Glass Walkers (2nd edition)
    PGG  = Players Guide to Garou (Revised) (scanned; read with OCR + page images)
    BG / GoF / SL = Bone Gnawers, Get of Fenris, Shadow Lords tribebooks (same)
*/
(function () {
  const R = WOD.random;

  const BOOKS = {
    Core: "Werewolf: the Apocalypse, Revised",
    WPG: "Werewolf Players Guide (2nd ed.)",
    CoG: "Tribebook: Children of Gaia (Revised)",
    GW: "Tribebook: Glass Walkers (2nd ed.)",
  };

  // Gift lists: core = { level: [names] }, extra = { book: { level: [names] } }
  const F = WOD.fera;
  const G = F.G;

  const DATA = {
    books: BOOKS,

    breeds: {
      Homid: {
        gnosis: 1,
        gifts: G(
          { 1: ["Master of Fire", "Persuasion", "Smell of Man"], 2: ["Jam Technology", "Staredown"], 3: ["Disquiet", "Reshape Object"], 4: ["Cocoon", "Spirit Ward"], 5: ["Assimilation", "Part the Veil"] },
          { WPG: { 3: ["Tongues"] } }
        ),
      },
      Metis: {

        gifts: G(
          { 1: ["Create Element", "Primal Anger", "Sense Wyrm"], 2: ["Burrow", "Curse of Hatred"], 3: ["Eyes of the Cat", "Mental Speech"], 4: ["Gift of the Porcupine", "Wither Limb"], 5: ["Madness", "Totem Gift"] },
          { WPG: { 1: ["Shed"], 3: ["Splintered Claw"] } }
        ),
      },
      Lupus: {
        gnosis: 5,
        gifts: G(
          { 1: ["Hare's Leap", "Heightened Senses", "Sense Prey"], 2: ["Scent of Sight", "Sense the Unnatural"], 3: ["Catfeet", "Name the Spirit"], 4: ["Beast Life", "Gnaw"], 5: ["Elemental Gift", "Song of the Great Beast"] },
          { WPG: { 3: ["Monkey Tail"], 4: ["Venom"] } }
        ),
      },
    },

    auspices: {
      Ragabash: {
        moon: "New Moon", rage: 1,
        gifts: G(
          { 1: ["Blur of the Milky Eye", "Open Seal", "Scent of Running Water"], 2: ["Blissful Ignorance", "Sense of the Prey", "Taking the Forgotten"], 3: ["Gremlins", "Open Moon Bridge"], 4: ["Luna's Blessing", "Whelp Body"], 5: ["Thieving Talons of the Magpie", "Thousand Forms"] },
          { WPG: { 2: ["Alter Scent", "Obscure the Truth"], 3: ["Fly Feet"] } }
        ),
      },
      Theurge: {
        moon: "Crescent Moon", rage: 2,
        gifts: G(
          { 1: ["Mother's Touch", "Sense Wyrm", "Spirit Speech"], 2: ["Command Spirit", "Name the Spirit", "Sight from Beyond"], 3: ["Exorcism", "Pulse of the Invisible"], 4: ["Grasp the Beyond", "Spirit Drain"], 5: ["Feral Lobotomy", "The Malleable Spirit"] },
          { WPG: { 2: ["Umbral Tether"], 3: ["Spirit Path", "Umbral Sight"], 4: ["Shadowplay"], 5: ["Spirit Vessel"] } }
        ),
      },
      Philodox: {
        moon: "Half Moon", rage: 3,
        gifts: G(
          { 1: ["Resist Pain", "Scent of the True Form", "Truth of Gaia"], 2: ["Call to Duty", "King of the Beasts", "Strength of Purpose"], 3: ["Weak Arm", "Wisdom of the Ancient Ways"], 4: ["Roll Over", "Scent of Beyond"], 5: ["Geas", "Wall of Granite"] },
          { WPG: { 3: ["Sense Balance"], 4: ["Take the True Form"] } }
        ),
      },
      Galliard: {
        moon: "Gibbous Moon", rage: 4,
        gifts: G(
          { 1: ["Beast Speech", "Call of the Wyld", "Mindspeak"], 2: ["Call of the Wyrm", "Distractions", "Dreamspeak"], 3: ["Eye of the Cobra", "Song of Rage"], 4: ["Bridge Walker", "Shadows by the Firelight"], 5: ["Fabric of the Mind", "Head Games"] },
          { WPG: { 2: ["Mimic"], 4: ["Song of the Siren"] } }
        ),
      },
      Ahroun: {
        moon: "Full Moon", rage: 5,
        gifts: G(
          { 1: ["Falling Touch", "Inspiration", "Razor Claws"], 2: ["Sense Silver", "Spirit of the Fray", "True Fear"], 3: ["Heart of Fury", "Silver Claws"], 4: ["Clenched Jaw", "Stoking Fury's Furnace"], 5: ["Kiss of Helios", "Strength of Will"] },
          { WPG: { 3: ["Combat Healing", "Shatter Bone"] } }
        ),
      },
    },

    // Minimum Renown for each Rank (1-5), Core p. 185. Ragabash: any combination.
    renownByRank: {
      Ragabash: [3, 7, 13, 19, 25],
      Theurge: [{ Wisdom: 3 }, { Glory: 1, Wisdom: 5 }, { Glory: 2, Honor: 1, Wisdom: 7 }, { Glory: 4, Honor: 2, Wisdom: 9 }, { Glory: 4, Honor: 9, Wisdom: 10 }],
      Philodox: [{ Honor: 3 }, { Glory: 1, Honor: 4, Wisdom: 1 }, { Glory: 2, Honor: 6, Wisdom: 2 }, { Glory: 3, Honor: 8, Wisdom: 4 }, { Glory: 4, Honor: 10, Wisdom: 9 }],
      Galliard: [{ Glory: 2, Wisdom: 1 }, { Glory: 4, Wisdom: 2 }, { Glory: 4, Honor: 2, Wisdom: 4 }, { Glory: 7, Honor: 2, Wisdom: 6 }, { Glory: 9, Honor: 5, Wisdom: 9 }],
      Ahroun: [{ Glory: 2, Honor: 1 }, { Glory: 4, Honor: 1, Wisdom: 1 }, { Glory: 6, Honor: 3, Wisdom: 1 }, { Glory: 9, Honor: 5, Wisdom: 2 }, { Glory: 10, Honor: 9, Wisdom: 4 }],
    },
    rankTitles: ["Cliath", "Fostern", "Adren", "Athro", "Elder"],

    // Willpower and Background limits: Core pp. 100-101 (Stargazers: Core appendix).
    // noBackgrounds: can't take at creation. minBackgrounds: must start with.
    tribes: {
      "Black Furies": {
        willpower: 3,

    const wantGender = opts.gender === "Female" || opts.gender === "Male" ? opts.gender : null;
    const breed = opts.breed || (wantGender === "Male" && opts.tribe === "Black Furies" ? "Metis" : R.pick(Object.keys(DATA.breeds)));
    const auspice = opts.auspice || R.pick(Object.keys(DATA.auspices));
    let tribeChoices = Object.keys(DATA.tribes);
    if (breed !== "Lupus") tribeChoices = tribeChoices.filter((t) => !DATA.tribes[t].lupusOnly);
    if (wantGender === "Male" && breed !== "Metis") tribeChoices = tribeChoices.filter((t) => t !== "Black Furies");
    const tribe = opts.tribe || R.pick(tribeChoices);
    const gender = wantGender || (tribe === "Black Furies" && breed !== "Metis" ? "Female" : F.pickGender({}));

    const b = DATA.breeds[breed];
    const a = DATA.auspices[auspice];
    const t = DATA.tribes[tribe];
    const notes = [];
    if (tribe === "Red Talons" && breed !== "Lupus") notes.push("Red Talons are almost all Lupus (a few metis); this combination breaks that rule.");
    if (t.note) notes.push(t.note);
    if (tribe === "Black Furies" && gender === "Male" && breed !== "Metis") notes.push("A male Black Fury who isn't metis breaks the tribe's rule.");

    // Attributes 7/5/3, Abilities 13/9/5 (max 3), Backgrounds 5.
    const { attrs, priority: attrPriority } = F.attributes();
    const { abil, priority: abilPriority, ok: abilityOk } = F.abilities(breed === "Lupus" ? DATA.lupusAvoids : []);
    const notAllowed = [...(t.noBackgrounds || []), ...(breed === "Lupus" ? ["Resources"] : [])];
    const { bg, allowed: bgAllowed } = F.backgrounds(DATA.backgrounds, notAllowed, t.minBackgrounds || {});

    // Gifts: one Level 1 each from breed, auspice and tribe, then one of each new level per Rank.
    const picker = F.giftPicker([[b.gifts, breed], [a.gifts, auspice], [t.gifts, tribe]], coreOnly);
    [breed, auspice, tribe].forEach((s) => picker.take(1, s));
    for (let lvl = 2; lvl <= rank; lvl++) picker.take(lvl, null);

    const adv = { Rage: a.rage, Gnosis: b.gnosis, Willpower: t.willpower };
    const renown = F.renown(["Glory", "Honor", "Wisdom"], DATA.renownByRank[auspice][rank - 1]);

    const rollable = (mf) =>
      !DATA.randomSkip.includes(mf[0]) &&
      !(breed === "Lupus" && DATA.lupusSkip.includes(mf[0])) &&
      (!mf[3] || mf[3] === tribe) &&
      (!coreOnly || mf[2] === "Core");
    const mf = F.meritsFlaws(DATA, freebieTotal, rollable, opts.meritsFlaws !== "No");
    const fr = F.spendFreebies({ attrs, abil, abilityOk, bg, bgAllowed, adv, picker }, mf.freebies);

    const name = makeName(breed, gender);
    const extras = [];
    if (breed === "Metis") extras.push({ title: "Metis Deformity", text: R.pick(DATA.metisDeformities) });

    const others = [
      ...Object.entries(DATA.breeds).filter(([n]) => n !== breed).map(([n, v]) => [`${n} (other breed)`, n, v.gifts]),
      ...Object.entries(DATA.auspices).filter(([n]) => n !== auspice).map(([n, v]) => [`${n} (other auspice)`, n, v.gifts]),
      ...Object.entries(DATA.tribes).filter(([n]) => n !== tribe).map(([n, v]) => [`${n} (other tribe)`, n, v.gifts]),
    ];

    const c = F.sheet({
      game: "Werewolf: the Apocalypse",
      name,
      header: [
        ["Name", name], ["Player", ""], ["Chronicle", ""],
        ["Breed", breed], ["Auspice", `${auspice} (${a.moon})`], ["Tribe", tribe],
        ["Nature", R.pick(DATA.archetypes)], ["Demeanor", R.pick(DATA.archetypes)], ["Concept", breed === "Lupus" ? R.pick(DATA.lupusConcepts) : R.pick(DATA.concepts)],
        ["Gender", gender], ["Rank", `${rank} (${DATA.rankTitles[rank - 1]})`], ["Camp", ""],
        ["Pack", ""], ["Totem", ""], ["Sept", ""],
      ],
      attrs, attrPriority, abil, abilPriority,
      bg, bgList: DATA.backgrounds,
      gifts: picker.gifts,
      giftOptions: F.giftOptions([[`${breed} (breed)`, breed, b.gifts], [`${auspice} (auspice)`, auspice, a.gifts], [`${tribe} (tribe)`, tribe, t.gifts]], others),
      rank, renown,
      merits: mf.merits, flaws: mf.flaws, mfData: DATA, mfOwn: tribe,
      adv,
      formColumns: ["Form", ...physSoc, "Diff."],
      formRows: F.formRows(DATA.forms, attrs, physSoc),
      extras, notes,
      freebieTotal, spent: fr.spent, leftover: fr.left,
      books: BOOKS,
      build: {
        avoid: breed === "Lupus" ? DATA.lupusAvoids : [],
        noBg: notAllowed,
        bgMin: t.minBackgrounds, bgStart: t.minBackgrounds,
        giftHint: `One Level 1 Gift each from your breed (${breed}), auspice (${auspice}) and tribe (${tribe})${rank > 1 ? `, plus one Gift of each Level from 2 to ${rank}` : ""}.`,
      },
    });
    c.choices = { breed, auspice, tribe, gender, rank, books: opts.books };
    c.choiceFields = { breed: "Breed", auspice: "Auspice", tribe: "Tribe", gender: "Gender", rank: "Rank" };
    return c;
  }

  // Keep the Forms table in step with hand-edited Attributes.
  function recompute(c) {
    c.table.rows = F.formRows(DATA.forms, F.attrsFromSheet(c), physSoc);
  }

  WOD.registerGame({
    id: "werewolf",
    label: "Werewolf: the Apocalypse",
    options: [
      { id: "breed", label: "Breed", choices: Object.keys(DATA.breeds) },
      { id: "auspice", label: "Auspice", choices: Object.keys(DATA.auspices) },
      { id: "tribe", label: "Tribe", choices: Object.keys(DATA.tribes) },
      { id: "gender", label: "Gender", choices: ["Female", "Male"] },
      { id: "rank", label: "Rank", choices: [1, 2, 3, 4, 5], default: 1, random: false },
      { id: "freebies", label: "Freebie points", type: "number", min: 0, max: 500, default: 15 },
      { id: "meritsFlaws", label: "Merits & Flaws", choices: ["Random", "No"], default: "Random", random: false },
      { id: "books", label: "Books", choices: ["All my books", "Core book only"], default: "All my books", random: false },
    ],
    generate,
    recompute,
  });
})();

        gifts: G({ 1: ["Rhino's Favor", "Skin of Jade"], 2: ["Heart of Fury", "Ricepaper Walk"], 3: ["Maker's Charm", "Paws of the Raging Spirit Tiger"], 4: ["Asuras' Bane", "Dragonroar"], 5: ["Call to Battle", "Thousand-Thunder Strike"] }) },

    felineAvoids: ["Computer", "Drive", "Firearms", "Law", "Politics", "Science", "Etiquette"],

    // Garou Merits & Flaws the Bastet book calls inappropriate (p. 79), plus wolf-only ones.
    forbidden: ["Ancestor Ally", "Insane Past Life", "Insane Ancestor", "Slip Sideways", "Pack Mentality", "Wolf Years", "Wolf Sight", "Fair Glabro", "Metis Child", "Foe from the Past"],

    metisDeformities: ["Albinism", "Blind in one eye", "Cleft palate", "Deaf", "Hairless patches", "Hunchback", "Lame leg", "Missing tail", "Mute", "Seizures", "Sickly", "Strange odor", "Twisted limb", "Withered arm"],

      merits: mf.merits, flaws: mf.flaws, mfData, mfOwn: tribe,

      extras, notes,
      freebieTotal, spent: fr.spent, leftover: fr.left,
      books: BOOKS,
      tribe,
      build: {
        avoid: breed === "Feline" ? DATA.felineAvoids : [],
        noBg: breed === "Feline" ? ["Resources"] : [],
        giftHint: `Three Level 1 Gifts in any mix from the General, ${breed} (breed) and ${tribe} (tribe) lists${rank > 1 ? `, plus one Gift of each Level from 2 to ${rank}` : ""}.`,
      },
    });
    c.choices = { breed, pryio, tribe, gender, rank, books: opts.books };
    c.choiceFields = { breed: "Breed", pryio: "Pryio", tribe: "Tribe", gender: "Gender", rank: "Rank" };
    return c;
  }

  function recompute(c) {
    const tribe = Object.keys(DATA.tribes).find((t) => c.header.find((h) => h[0] === "Tribe")[1].startsWith(t));
    c.table.rows = F.formRows(DATA.tribes[tribe || "Bagheera"].forms, F.attrsFromSheet(c), physSoc);
  }

  WOD.registerGame({
    id: "bastet",
    label: "Bastet (werecats)",
    options: [
      { id: "breed", label: "Breed", choices: Object.keys(DATA.breeds) },
      { id: "pryio", label: "Pryio", choices: Object.keys(DATA.pryio) },
      { id: "tribe", label: "Tribe", choices: Object.keys(DATA.tribes) },
      { id: "gender", label: "Gender", choices: ["Female", "Male"] },
      { id: "rank", label: "Rank", choices: [1, 2, 3, 4, 5], default: 1, random: false },

      { id: "meritsFlaws", label: "Merits & Flaws", choices: ["Random", "No"], default: "Random", random: false },
      { id: "books", label: "Books", choices: ["All my books", "Core book only"], default: "All my books", random: false },
    ],
    generate,
    recompute,
  });
})();

    // Archid Characteristics (p. 38-39). * = may be taken more than once.
    archid: ["Air Sacs", "Armored Scales*", "Back Sail", "Behemoth*", "Binocular Vision", "Bladed Tail", "Color Change*", "Constricting Coils", "Contact Venom", "Crop", "Deep Lung", "Dragon Mask", "Duck Bill", "Extra Limbs*", "Eye Cones", "Feathers", "Fiery Pearl", "Fins", "Fire Breath*", "Food Storage", "Fur", "Gecko Pads", "Gills", "Grasping Hands", "Hard Skull", "Hinged Jaw", "Hollow Bones", "Horn", "Huge Size", "Jacobson's Organ", "Long Neck", "Long Teeth", "Long Tongue", "Multiple Heads", "Neck Frill", "Nictating Membrane", "Poison Sacs*", "Predator's Roar", "Prehensile Tail", "Regeneration", "Resplendent Crest", "Royal Crest", "Sacral Plexus*", "Sickening Slime", "Snorkel", "Spitter", "Tail Club", "Tall*", "Terrible Claws", "Thorns", "Throat Sac and Wattles", "Tongue Flick", "Upright Walking", "Webbed Feet", "Wings"],

  SUN_GIFTS.Shrouded.extra.PGCB = { 1: ["Sense Dissolver"] };

  window.MOKOLE_DATA = DATA;

  const physSoc = ["Strength", "Dexterity", "Stamina", "Manipulation", "Appearance"];

  function auspiceTable(streamName) {
    const kind = DATA.streams[streamName].auspices;
    return DATA[kind];
  }

  function formsFor(varnaName) {
    return [
      { name: "Homid", mods: {} },
      { name: "Archid", mods: DATA.archidMods, zero: ["Appearance"] },
      { name: `Suchid (${varnaName})`, mods: DATA.varna[varnaName].mods },
    ];
  }

  function generate(opts) {
    const rank = Math.min(5, Math.max(1, Number(opts.rank) || 1));
    const freebieTotal = Number.isFinite(opts.freebies) ? opts.freebies : 15;

    const breed = opts.breed || R.pick(Object.keys(DATA.breeds));
    const streamName = opts.stream || R.pick(Object.keys(DATA.streams));
    const stream = DATA.streams[streamName];
    const table = auspiceTable(streamName);
    // The page's Auspice list mixes all three systems. An auspice from another system
    // (e.g. after changing Stream on the sheet) maps to the same position in this one.
    let auspice = opts.auspice && table[opts.auspice] ? opts.auspice : null;
    if (!auspice && opts.auspice) {
      const from = [DATA.solar, DATA.makara, DATA.zhongLung].find((t) => t[opts.auspice]);
      if (from) auspice = Object.keys(table)[Object.keys(from).indexOf(opts.auspice) % Object.keys(table).length];
    }
    auspice = auspice || R.pick(Object.keys(table));
    const a = table[auspice];
    const varnaName = opts.varna || R.pick(stream.varna);
    const v = DATA.varna[varnaName];
    const notes = [];
    const gender = F.pickGender(opts);
    if (opts.auspice && !table[opts.auspice]) notes.push(`${opts.auspice} isn't a ${streamName} auspice, so ${auspice} was used instead.`);
    if (!stream.varna.includes(varnaName)) notes.push(`${varnaName} is uncommon among the ${streamName}.`);

    const { attrs, priority: attrPriority } = F.attributes();
    const { abil, priority: abilPriority, ok: abilityOk } = F.abilities(breed === "Suchid" ? DATA.suchidAvoids : []);
    const { bg, allowed: bgAllowed } = F.backgrounds(DATA.backgrounds, breed === "Suchid" ? DATA.suchidNoBackgrounds : []);

    // One auspice Gift and one general Gift; one more of each new level per Rank.
    const auspiceGifts = SUN_GIFTS[a.gifts];
    const picker = F.giftPicker([[auspiceGifts, auspice], [DATA.general, "General"], [stream.gifts, streamName]], opts.books === "Core book only");
    picker.take(1, auspice);
    picker.take(1, "General");
    for (let lvl = 2; lvl <= rank; lvl++) picker.take(lvl, null);

    // Rage by varna (by auspice for Zhong Lung); Willpower by auspice (4 for Zhong Lung).
    const adv = {
      Rage: stream.auspices === "zhongLung" ? a.rage : v.rage,
      Gnosis: DATA.breeds[breed].gnosis,
      Willpower: stream.willpower || a.willpower,
    };

    const need = a.garou ? window.WEREWOLF_DATA.renownByRank[a.garou][rank - 1] : (a.renown === "total" ? CHARTS.total[rank - 1] : CHARTS[a.renown][rank - 1]);
    const renown = F.renown(["Glory", "Honor", "Wisdom"], need);

    const rollable = (mf) => !DATA.randomSkip.includes(mf[0]) && (!mf[3] || mf[3] === streamName);
    const mf = F.meritsFlaws(DATA, freebieTotal, rollable, opts.meritsFlaws !== "No");
    const fr = F.spendFreebies({ attrs, abil, abilityOk, bg, bgAllowed, adv, picker }, mf.freebies);

    // Archid Characteristics: as many points as final Gnosis (Gumagan also have Gills).
    const chars = stream.gills ? ["Gills"] : [];
    for (let i = 0; i < adv.Gnosis; i++) {
      const pool = DATA.archid.filter((c) => c.endsWith("*") || !chars.includes(c));
      chars.push(R.pick(pool).replace("*", ""));
    }
    const charCounts = {};
    chars.forEach((c) => (charCounts[c] = (charCounts[c] || 0) + 1));
    const charList = Object.entries(charCounts).map(([c, n]) => (n > 1 ? `${c} ×${n}` : c));
    if (stream.gills) notes.push("All Gumagan have Gills for free.");

    const name = breed === "Suchid" ? R.pick(DATA.names.suchid) : `${F.firstName(DATA.names, gender)} ${R.pick(DATA.names.last)}`;
    const auspiceText = a.title ? `${auspice} (${a.title})` : auspice;

    const allAuspices = [
      ...Object.entries(DATA.solar).map(([n, x]) => [n, x.gifts]),
    ];
    const others = [
      ...allAuspices.filter(([n, key]) => key !== a.gifts).map(([n, key]) => [`${n} (other auspice)`, n, SUN_GIFTS[key]]),
      ...Object.entries(DATA.streams).filter(([n]) => n !== streamName).map(([n, s]) => [`${n} (other stream)`, n, s.gifts]),
    ];

    const c = F.sheet({
      game: "Mokolé",
      name,
      header: [
        ["Name", name], ["Player", ""], ["Chronicle", ""],
        ["Breed", breed], ["Auspice", auspiceText], ["Stream", `${streamName} (${stream.place})`],
        ["Nature", R.pick(F.ARCHETYPES)], ["Demeanor", R.pick(F.ARCHETYPES)], ["Concept", breed === "Suchid" ? R.pick(DATA.suchidConcepts) : R.pick(DATA.concepts)],
        ["Rank", `${rank} (${DATA.rankTitles[rank - 1]})`], ["Varna", `${varnaName} (${v.animal})`], ["Gender", gender],
        ["Clutch", ""], ["Totem", ""], ["Notes", ""],
      ],
      attrs, attrPriority, abil, abilPriority,
      bg, bgList: DATA.backgrounds,
      gifts: picker.gifts,
      giftOptions: F.giftOptions([[`${auspice} (auspice)`, auspice, auspiceGifts], ["General", "General", DATA.general], [`${streamName} (stream)`, streamName, stream.gifts]], others),
      rank, renown,
      extraColumns: [{
        title: "Archid Form",
        columns: [{
          title: `Archid Characteristics (points = Gnosis ${adv.Gnosis})`,
          list: charList,
          listOptions: [{ options: DATA.archid.map((c) => c.replace("*", "")) }],
          allowCustom: true,
          addLabel: "Add characteristic",
          customPrompt: "Archid characteristic:",
        }],
      }],
      merits: mf.merits, flaws: mf.flaws, mfData: DATA, mfOwn: streamName,
      adv,
      formColumns: ["Form", ...physSoc],
      formRows: F.formRows(formsFor(varnaName), attrs, physSoc),
      notes,
      freebieTotal, spent: fr.spent, leftover: fr.left,
      books: BOOKS,
      build: {
        avoid: breed === "Suchid" ? DATA.suchidAvoids : [],
        noBg: breed === "Suchid" ? DATA.suchidNoBackgrounds : [],
        giftHint: `One Level 1 Gift from your auspice (${auspice}) and one from the General list${rank > 1 ? `, plus one Gift of each Level from 2 to ${rank}` : ""}.`,
      },
    });
    c.choices = { breed, stream: streamName, auspice, varna: varnaName, gender, rank, books: opts.books };
    c.choiceFields = { breed: "Breed", stream: "Stream", auspice: "Auspice", varna: "Varna", gender: "Gender", rank: "Rank" };
    return c;
  }

  function recompute(c) {
    const varnaText = c.header.find((h) => h[0] === "Varna")[1];
    const varnaName = Object.keys(DATA.varna).find((n) => varnaText.startsWith(n)) || "Karna";
    c.table.rows = F.formRows(formsFor(varnaName), F.attrsFromSheet(c), physSoc);
  }

  WOD.registerGame({
    id: "mokole",
    label: "Mokolé (weresaurians)",
    options: [
      { id: "breed", label: "Breed", choices: Object.keys(DATA.breeds) },
      { id: "stream", label: "Stream", choices: Object.keys(DATA.streams) },
      { id: "auspice", label: "Auspice", choices: [...Object.keys(DATA.solar), ...Object.keys(DATA.makara), ...Object.keys(DATA.zhongLung)],
        // On the sheet, only the auspices of the character's stream.
        choicesFor: (ch) => Object.keys(auspiceTable(ch.stream)) },
      { id: "varna", label: "Varna", choices: Object.keys(DATA.varna) },
      { id: "gender", label: "Gender", choices: ["Female", "Male"] },
      { id: "rank", label: "Rank", choices: [1, 2, 3, 4, 5], default: 1, random: false },
      { id: "freebies", label: "Freebie points", type: "number", min: 0, max: 500, default: 15 },
      { id: "meritsFlaws", label: "Merits & Flaws", choices: ["Random", "No"], default: "Random", random: false },
      { id: "books", label: "Books", choices: ["All my books", "Core book only"], default: "All my books", random: false },
    ],
    generate,
    recompute,
  });
})();

  <script>

(function () {

  const TOTALS = [3, 7, 13, 19, 25];
  const GENERIC_BG = ["Allies", "Ancestors", "Contacts", "Fetish", "Kinfolk", "Mentor", "Pure Breed", "Resources", "Rites", "Totem"];
  const NOT_WOLF = ["Wolf Sight", "Wolf Years", "Fair Glabro", "Pack Mentality", "Ancestor Ally", "Insane Ancestor", "Metis Child", "Sign of the Wolf", "Foe from the Past"];

      const from = R.pick(BACKGROUNDS.filter((n) => n !== "Generation" && bg[n] > 0));
      if (!from) break;
      bg[from]--;
      bg.Generation++;
    }

    // Disciplines: 3 dots among the clan's (Caitiff: any common ones).
    const discList = caitiff ? R.shuffle(COMMON).slice(0, R.int(1, 3)) : k.disc.slice();
    const disc = Object.fromEntries(discList.map((d) => [d, 0]));
    R.distribute(disc, discList, 3, 3);

    // Virtues: each starts at 1, plus 7 dots.
    const virt = { Conscience: 1, "Self-Control": 1, Courage: 1 };
    R.distribute(virt, VIRTUES, 7, 5);

    // Merits & Flaws from the clan's own list (fixed costs only when rolling).
    const mfData = mfLists(clan);
    const mf = F.meritsFlaws({ merits: mfData.rollMerits, flaws: mfData.rollFlaws }, freebieTotal, () => true, opts.meritsFlaws !== "No" && freebieTotal > 0);

    // Freebies.
    const adv = { Humanity: virt.Conscience + virt["Self-Control"], Willpower: virt.Courage };
    const spent = [];
    let left = mf.freebies;
    const canBuy = {
      Attribute: () => Object.keys(attrs).filter((n) => attrs[n] < 5 && !(clan === "Nosferatu" && n === "Appearance")),
      Ability: () => Object.keys(abil).filter((n) => abil[n] < 5),
      Discipline: () => Object.keys(disc).filter((n) => disc[n] < 5),
      Background: () => BACKGROUNDS.filter((n) => bg[n] < 5 && n !== "Generation"),
      Virtue: () => VIRTUES.filter((n) => virt[n] < 5),
      Humanity: () => (adv.Humanity < 10 ? ["Humanity"] : []),
      Willpower: () => (adv.Willpower < 10 ? ["Willpower"] : []),
    };
    const weights = { Ability: 4, Background: 3, Attribute: 2, Discipline: 1, Willpower: 2, Humanity: 1, Virtue: 1 };
    while (left > 0) {
      const w = {};
      for (const [kind, x] of Object.entries(weights)) if (COSTS[kind] <= left && canBuy[kind]().length) w[kind] = x;
      if (!Object.keys(w).length) break;
      const kind = R.weighted(w);
      const name = R.pick(canBuy[kind]());
      if (kind === "Attribute") attrs[name]++;
      else if (kind === "Ability") abil[name]++;
      else if (kind === "Discipline") disc[name]++;
      else if (kind === "Background") bg[name]++;
      else if (kind === "Virtue") {
        // Humanity and Willpower are worked out from the Virtues, so they rise with them.
        virt[name]++;
        if (name === "Courage") adv.Willpower = Math.min(10, adv.Willpower + 1);
        else adv.Humanity = Math.min(10, adv.Humanity + 1);
      }
      else adv[kind]++;
      left -= COSTS[kind];
      const row = spent.find((x) => x.name === name);
      if (row) { row.n++; row.cost += COSTS[kind]; } else spent.push({ name, n: 1, cost: COSTS[kind] });
    }
    if (left > 0) notes.push(`${F.pts(left)} of freebie points left over: everything that could be raised is already at maximum.`);

    const name = `${F.firstName(NAMES, gender)} ${R.pick(NAMES.last)}`;
    const toItems = (obj, keys, max) => keys.map((n) => [n, obj[n], max]);
    const flawPts = mf.flaws.reduce((s, f) => s + f[1], 0);
    const meritPts = mf.merits.reduce((s, m) => s + m[1], 0);
    let freebieText = String(freebieTotal);
    if (flawPts) freebieText += ` + ${F.pts(flawPts)} from Flaws`;
    if (meritPts) freebieText += ` − ${F.pts(meritPts)} on Merits`;

    const c = {
      game: "Vampire: the Masquerade",
      name,
      header: [
        ["Name", name], ["Player", ""], ["Chronicle", ""],
        ["Nature", R.pick(F.ARCHETYPES)], ["Demeanor", R.pick(F.ARCHETYPES)], ["Concept", R.pick(CONCEPTS)],
        ["Clan", clan], ["Generation", ""], ["Sire", ""],
        ["Gender", gender], ["Sect", sect], ["Haven", ""],
      ],
      sections: [
        { title: "Attributes", columns: Object.keys(F.ATTRIBUTES).map((cat) => ({ title: `${cat} (${attrPriority[cat]})`, items: toItems(attrs, F.ATTRIBUTES[cat], 5) })) },
        {
          title: "Abilities",
          columns: Object.keys(ABILITIES).map((cat) => ({
            title: `${cat} (${abilPriority[cat]})`,
            items: toItems(abil, ABILITIES[cat], 5),
            allowCustom: true,
            addLabel: `Add ${cat.replace(/s$/, "").toLowerCase()}`,
            customPrompt: `Name of the new ${cat.replace(/s$/, "").toLowerCase()}:`,
          })),
        },
        {
          title: "Advantages",
          columns: [
            { title: "Disciplines", items: Object.keys(disc).map((n) => [n, disc[n], 5]), removable: true, addOptions: DISCIPLINES, allowCustom: true, addLabel: "Add Discipline", customPrompt: "Name of the Discipline:" },
            { title: "Backgrounds", items: BACKGROUNDS.filter((n) => bg[n] > 0).map((n) => [n, bg[n], 5]), removable: true, addOptions: BACKGROUNDS, allowCustom: true, addLabel: "Add background", customPrompt: "Name of the background:" },
            { title: "Virtues", items: toItems(virt, VIRTUES, 5) },
          ],
        },
        {
          title: "Merits & Flaws",
          columns: [
            { title: "Merits", list: mf.merits.map(F.mfLabel), listOptions: F.groupByCost(mfData.merits, mfData.own), allowCustom: true, addLabel: "Add Merit", customPrompt: "Merit name and cost, e.g. Iron Will (5 pts):" },
            { title: "Flaws", list: mf.flaws.map(F.mfLabel), listOptions: F.groupByCost(mfData.flaws, mfData.own), allowCustom: true, addLabel: "Add Flaw", customPrompt: "Flaw name and value, e.g. Nightmares (1 pt):" },
          ],
        },
        {
          title: "Humanity, Willpower & Blood Pool",
          columns: [
            { title: "Humanity", items: [["Rating", adv.Humanity, 10]] },
            { title: "Willpower", items: [["Permanent", adv.Willpower, 10]], boxes: 10 },
            { title: "Blood Pool", boxes: 10, text: "" },
          ],
        },
      ],
      table: null,
      panel: { title: "Clan & Blood", lines: [] },
      health: F.HEALTH,
      extras: [],
      freebies: { total: freebieText, spent: spent.map((x) => `${x.name} +${x.n} (${F.pts(x.cost)})`) },
      notes,
      sources: [...new Set([...mf.merits, ...mf.flaws].map((x) => x[2]))].map((b) => `${b} = ${BOOKS[b]}`),
      choices: { clan, sect, gender },
      choiceFields: { clan: "Clan", sect: "Sect", gender: "Gender" },
      build: {
        rank: 1, avoid: [], noBg: [], bgStart: {}, bgFree: 5, freeAbil: {}, keepGifts: [], giftHint: "", ownSources: [],
        costs: COSTS,
        advKinds: ["Humanity", "Willpower"],
        choiceAdv: [], // Humanity and Willpower come from Virtues, not from clan or sect
        pools: [
          { title: "Disciplines", column: "Disciplines", kind: "Discipline", size: 3, startAll: 0, fillCap: 3, allowed: caitiff ? null : k.disc, hint: caitiff ? "Three dots in any Disciplines (Caitiff have no clan Disciplines)." : `Three dots among your clan Disciplines: ${k.disc.join(", ")}.` },
          { title: "Virtues", column: "Virtues", kind: "Virtue", size: 7, startAll: 1, fillCap: 5, hint: "Each Virtue starts at 1. Humanity = Conscience + Self-Control; Willpower = Courage." },
        ],
        attrStart: clan === "Nosferatu" ? { Appearance: 0 } : {},
        attrMax: clan === "Nosferatu" ? { Appearance: 0 } : {},
        clanDisciplines: k.disc,
        caitiff,
        costText: COST_TEXT,
        xpText: XP_TEXT,
      },
    };
    recompute(c);
    return c;
  }

  // Keep Generation, blood pool and clan notes in step with the sheet. While a player
  // builds the character, Humanity and Willpower follow the Virtues (plus anything bought).
  function recompute(c) {
    const cols = c.sections.flatMap((s) => s.columns);
    const col = (t) => cols.find((x) => x.title === t);
    const genDots = (col("Backgrounds").items.find((x) => x[0] === "Generation") || [0, 0])[1];
    const gen = Math.max(4, 13 - genDots);
    const [pool, perTurn, maxTrait] = GENERATION[gen];
    c.header.find((h) => h[0] === "Generation")[1] = `${ordinal(gen)}`;
    const blood = col("Blood Pool");
    blood.boxes = pool;
    blood.text = `Up to ${pool}, ${perTurn} per turn`;

    if (c.stage === "build") {
      const v = Object.fromEntries(col("Virtues").items.map((x) => [x[0], x[1]]));
      const base = { Humanity: (v.Conscience || 0) + (v["Self-Control"] || 0), Willpower: v.Courage || 0 };
      for (const kind of ["Humanity", "Willpower"]) {
        const it = col(kind).items[0];
        const old = c.build.adv[kind] ?? base[kind];
        it[1] = Math.max(0, Math.min(10, it[1] - old + base[kind]));
        c.build.adv[kind] = base[kind];
      }
    }

    const clan = (c.choices && c.choices.clan) || c.header.find((h) => h[0] === "Clan")[1];
    const k = CLANS[clan] || CLANS.Caitiff;
    // Nosferatu Appearance is always 0; anyone else starts at 1 at least.
    const app = c.sections[0].columns.flatMap((x) => x.items).find((x) => x[0] === "Appearance");
    if (clan === "Nosferatu") app[1] = 0;
    else if (app[1] === 0) app[1] = 1;
    const discs = col("Disciplines").items.map((x) => x[0]);
    c.panel.lines = [
      ["Clan weakness (summary)", k.weakness],
      ["Clan Disciplines", k.disc.length ? k.disc.join(", ") : "none (Caitiff)"],
      ["Generation", `${ordinal(gen)}: blood pool ${pool}, ${perTurn} per turn, Traits up to ${maxTrait}`],
      ["Starting blood", "roll one die for the blood in the body at the start of play"],
      ...Object.keys(PATHS).filter((d) => discs.includes(d)).map((d) => ["Blood magic", PATHS[d]]),
    ];
  }

  WOD.registerGame({
    id: "vampire",
    label: "Vampire: the Masquerade",
    options: [
      { id: "clan", label: "Clan", choices: Object.keys(CLANS) },
      { id: "sect", label: "Sect", choices: SECTS },
      { id: "gender", label: "Gender", choices: ["Female", "Male"] },
      { id: "generation", label: "Generation", choices: [13, 12, 11, 10, 9, 8], npcOnly: true },
      { id: "freebies", label: "Freebie points", type: "number", min: 0, max: 500, default: 15 },
      { id: "meritsFlaws", label: "Merits & Flaws", choices: ["Random", "No"], default: "Random", random: false },
    ],
    generate,
    recompute,
  });
})();

</script>
  <script>WOD.init();</script>
