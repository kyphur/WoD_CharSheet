<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>World of Darkness Character Generator</title>
  <style>
:root {
  --ink: #000;
  --paper: #fff;
  --accent: #7a1010;
  --line: #000;
  --soft: #f2f2f2;
}

* { box-sizing: border-box; }

body {
  margin: 0;
  background: var(--soft);
  color: var(--ink);
  font: 16px/1.4 Georgia, "Times New Roman", serif;
}

/* ---------- controls ---------- */
.controls {
  position: sticky;
  top: 0;
  z-index: 1;
  display: flex;
  flex-wrap: wrap;
  gap: 12px;
  align-items: center;
  padding: 12px 16px;
  background: var(--paper);
  border-bottom: 2px solid var(--ink);
  font-family: system-ui, Segoe UI, Arial, sans-serif;
}
.controls #options { display: flex; flex-wrap: wrap; gap: 12px; }
.controls label { font-weight: 600; }
.controls select {
  font: inherit;
  font-weight: 400;
  padding: 6px 8px;
  border: 2px solid var(--ink);
  border-radius: 6px;
  background: var(--paper);
  color: var(--ink);
}
.controls button {
  font: inherit;
  font-weight: 700;
  padding: 8px 16px;
  border: 2px solid var(--ink);
  border-radius: 6px;
  cursor: pointer;
  background: var(--paper);
  color: var(--ink);
}
.controls button.primary { background: var(--accent); border-color: var(--accent); color: #fff; }
.controls .spacer { flex: 1; }
.controls input.num {
  width: 5em;
  font: inherit;
  font-weight: 400;
  padding: 6px 8px;
  border: 2px solid var(--ink);
  border-radius: 6px;
}

/* ---------- editing ---------- */
.hint {
  margin: 0 0 10px;
  padding: 8px 10px;
  border: 2px solid var(--ink);
  border-radius: 6px;
  font-family: system-ui, Segoe UI, Arial, sans-serif;
  font-size: 14px;
}
.field input.value {
  flex: 1;
  min-width: 0;
  font: inherit;
  color: var(--ink);
  border: 0;
  background: transparent;
  padding: 0;
}
.field input.value:hover { background: var(--soft); }
.field input.value:focus { outline: 2px solid var(--accent); background: #fff; }
.dot { cursor: pointer; }
.dot:hover { outline: 2px solid var(--accent); outline-offset: 1px; }
select.add {
  display: block;
  width: 100%;
  margin-top: 6px;
  font: 14px system-ui, Segoe UI, Arial, sans-serif;
  padding: 4px 6px;
  border: 1.5px solid var(--ink);
  border-radius: 6px;
  background: #fff;
  color: var(--ink);
}
.remove {
  margin-right: 6px;
  width: 20px;
  height: 20px;
  line-height: 16px;
  padding: 0;
  font: 700 15px system-ui, Arial, sans-serif;
  border: 1.5px solid var(--ink);
  border-radius: 50%;
  background: #fff;
  color: var(--ink);
  cursor: pointer;
  vertical-align: middle;
}
.remove:hover { background: var(--accent); border-color: var(--accent); color: #fff; }
ul li { margin: 2px 0; }
ul:has(.remove) { list-style: none; padding-left: 0; }
.cols.two { grid-template-columns: repeat(2, minmax(0, 1fr)); }
.cols.one { grid-template-columns: 1fr; }
.cols.one ul { columns: 3; column-gap: 24px; }

/* ---------- sheet ---------- */
#sheet {
  max-width: 1000px;
  margin: 16px auto 32px;
  padding: 24px 28px;
  background: var(--paper);
  border: 2px solid var(--ink);
}
.sheet-title h1 {
  margin: 0 0 12px;
  text-align: center;
  font-size: 28px;
  letter-spacing: 1px;
  text-transform: uppercase;
  color: var(--accent);
}
.header-grid {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 6px 20px;
  margin-bottom: 8px;
}
.field { display: flex; gap: 6px; border-bottom: 1px solid var(--line); padding: 2px 0; }
.field .label { font-weight: 700; white-space: nowrap; }
.field .value { flex: 1; }

section { margin-top: 14px; }
h2 {
  margin: 0 0 8px;
  font-size: 18px;
  text-align: center;
  text-transform: uppercase;
  letter-spacing: 2px;
  border-top: 2px solid var(--ink);
  border-bottom: 2px solid var(--ink);
  padding: 2px 0;
}
h3 { margin: 0 0 4px; font-size: 15px; text-align: center; }

.cols { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 4px 24px; }
.trait { display: flex; justify-content: space-between; align-items: center; gap: 8px; padding: 1px 0; }
.trait.zero .trait-name { font-weight: 400; }
.trait-name { font-weight: 600; }
.empty { margin: 0; font-style: italic; text-align: center; }
ul { margin: 0; padding-left: 20px; }

.dots { display: inline-flex; gap: 3px; flex-shrink: 0; }
.dot {
  width: 12px;
  height: 12px;
  border: 1.5px solid var(--ink);
  border-radius: 50%;
  -webkit-print-color-adjust: exact;
  print-color-adjust: exact;
}
.dot.on { background: var(--ink); }

.boxes { display: inline-flex; gap: 2px; }
.box {
  display: inline-block;
  width: 13px;
  height: 13px;
  border: 1.5px solid var(--ink);
}

.split { display: grid; grid-template-columns: 2fr 1fr; gap: 24px; }
table { width: 100%; border-collapse: collapse; }
th, td { border: 1px solid var(--ink); padding: 2px 6px; text-align: center; }
th { background: var(--soft); }
.health td { border: none; border-bottom: 1px solid var(--ink); text-align: left; }
.health td:nth-child(2) { text-align: center; width: 40px; }
.health td:last-child { width: 24px; }

.warn { font-weight: 700; color: var(--accent); }

/* ---------- player build: points box ---------- */
.budget {
  margin: 0 0 12px;
  padding: 10px 12px;
  border: 3px solid var(--ink);
  border-radius: 8px;
  font-family: system-ui, Segoe UI, Arial, sans-serif;
  font-size: 15px;
}
.budget h2 { border: 0; margin-bottom: 6px; }
.brow { padding: 5px 0; border-bottom: 1px solid #bbb; }
.brow > strong { display: inline-block; min-width: 9em; }
.chip {
  display: inline-block;
  margin: 2px 4px 2px 0;
  padding: 2px 8px;
  border: 2px solid var(--ink);
  border-radius: 12px;
  font-weight: 600;
}
.chip.ok { background: #fff; }
.chip.left { background: #fff3b0; }
.chip.over { background: var(--accent); border-color: var(--accent); color: #fff; }
.bhint { font-size: 13px; margin-top: 2px; }
.warnings { margin: 8px 0 0; padding-left: 20px; color: var(--accent); font-weight: 700; }
.bbuttons { margin-top: 10px; display: flex; gap: 10px; flex-wrap: wrap; }
button[data-action], .xp-add button {
  font: 700 15px system-ui, Segoe UI, Arial, sans-serif;
  padding: 7px 14px;
  border: 2px solid var(--ink);
  border-radius: 6px;
  background: #fff;
  color: var(--ink);
  cursor: pointer;
}
button[data-action].primary { background: var(--accent); border-color: var(--accent); color: #fff; }

/* ---------- experience ---------- */
.xp-totals { font-size: 17px; }
.xp-add { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; margin: 6px 0; font-family: system-ui, Segoe UI, Arial, sans-serif; }
.xp-add input[type="number"], .xp-add input[type="text"] {
  font: inherit;
  padding: 6px 8px;
  border: 2px solid var(--ink);
  border-radius: 6px;
}
.xp-add input[type="number"] { width: 5em; }
.xp-add input[type="text"] { flex: 1; min-width: 12em; }
.xp-free { font-weight: 600; }
.xp-log { columns: 2; column-gap: 24px; }

/* ---------- small screens ---------- */
@media (max-width: 720px) {
  #sheet { margin: 0; padding: 16px; border-left: 0; border-right: 0; }
  .header-grid, .cols, .cols.two { grid-template-columns: 1fr; }
  .split { grid-template-columns: 1fr; }
}

/* ---------- printing / Save as PDF ---------- */
@media print {
  @page { size: letter; margin: 0.35in; }
  body { background: #fff; font-size: 11px; line-height: 1.25; }
  .controls, .no-print { display: none !important; }
  ul:has(.remove) { list-style: disc; padding-left: 16px; }
  .cols.two { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  #sheet { margin: 0; padding: 0; border: 0; max-width: none; }
  .sheet-title h1 { font-size: 22px; margin-bottom: 6px; }
  .header-grid { grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 2px 16px; }
  .cols { grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 0 18px; }
  .split { grid-template-columns: minmax(0, 2fr) minmax(0, 1fr); gap: 16px; }
  section { margin-top: 8px; break-inside: avoid; }
  h2 { font-size: 13px; margin-bottom: 4px; padding: 1px 0; }
  h3 { font-size: 12px; margin-bottom: 2px; }
  .trait { padding: 0; }
  .dots { gap: 2px; }
  .dot { width: 8px; height: 8px; border-width: 1px; }
  .boxes { gap: 1px; }
  .box { width: 9px; height: 9px; border-width: 1px; }
  th, td { padding: 1px 4px; }
  p { margin: 4px 0; }
  .xp-totals { font-size: 11px; }
  .xp-log { columns: 3; font-size: 10px; }
}

/* ---------- choices on the sheet (breed, auspice, tribe...) ---------- */
select.hsel {
  flex: 1;
  min-width: 0;
  font: inherit;
  color: var(--ink);
  border: 0;
  background: transparent;
  padding: 0;
  cursor: pointer;
}
select.hsel:hover { background: var(--soft); }
select.hsel:focus { outline: 2px solid var(--accent); }
.col-text { margin: 4px 0 0; font-size: 14px; }
@media print {
  select.hsel { appearance: none; -webkit-appearance: none; }
  .col-text { font-size: 10px; }
}

</style>
</head>
<body>
  <div class="controls">
    <label>Sheet <select id="mode"><option value="npc">NPC (random)</option><option value="pc">Player character (build it)</option></select></label>
    <label>Game <select id="game"></select></label>
    <div id="options"></div>
    <div class="spacer"></div>
    <button id="generate" class="primary">Generate</button>
    <button id="save">Save character</button>
    <button id="open">Open character</button>
    <input type="file" id="open-file" accept=".json,application/json" hidden>
    <button id="print">Print / Save as PDF</button>
  </div>

  <main id="sheet"></main>

  <script>
/*
  Shared code for the World of Darkness character generator.
  Each game lives in games/<name>.js and registers itself with WOD.registerGame().

  A character is one plain object (header, sections, table, ...). The sheet is
  drawn from that object, and every edit on the sheet changes the object and
  redraws, so what you see is always what gets printed or saved.

  Two kinds of sheet:
    NPC (c.mode "npc")     random character, edit freely.
    Player (c.mode "pc")   c.stage "build": the player spends creation points, shown in a points box;
                           c.stage "play":  raising a dot spends experience points (c.xp).
  Any NPC can also start tracking experience.
*/
window.WOD = (function () {
  const games = [];
  const SAVE_KEY = "wod-character-generator:last";

  const random = {
    int(min, max) {
      return min + Math.floor(Math.random() * (max - min + 1));
    },
    pick(list) {
      return list.length ? list[Math.floor(Math.random() * list.length)] : undefined;
    },
    chance(p) {
      return Math.random() < p;
    },
    shuffle(list) {
      const a = list.slice();
      for (let i = a.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [a[i], a[j]] = [a[j], a[i]];
      }
      return a;
    },
    // weights: { name: weight }
    weighted(weights) {
      const entries = Object.entries(weights).filter(([, w]) => w > 0);
      let roll = Math.random() * entries.reduce((s, [, w]) => s + w, 0);
      for (const [k, w] of entries) {
        roll -= w;
        if (roll < 0) return k;
      }
      return entries[entries.length - 1][0];
    },
    // Add `points` dots one at a time to random keys, never going above `max`.
    distribute(obj, keys, points, max) {
      for (let p = 0; p < points; p++) {
        const open = keys.filter((k) => (obj[k] || 0) < max);
        if (!open.length) return points - p; // dots that couldn't be placed
        const k = random.pick(open);
        obj[k] = (obj[k] || 0) + 1;
      }
      return 0;
    },
  };

  function registerGame(game) {
    games.push(game);
  }

  // ---------- experience ----------

  const xpTotals = (c) => {
    const log = (c.xp && c.xp.log) || [];
    const earned = log.filter((e) => e.type === "earn").reduce((s, e) => s + e.xp, 0);
    const spent = log.filter((e) => e.type === "spend").reduce((s, e) => s + e.xp, 0);
    return { earned, spent, left: earned - spent };
  };
  const traitKey = (s, col, name) => `${s.title}|${col.title.split(" (")[0]}|${name}`;

  // Remember every rating as it is now; experience is only charged above these.
  function startXp(c) {
    c.stage = "play";
    c.xp = c.xp || { log: [] };
    c.xpBase = { gifts: [] };
    for (const s of c.sections) {
      for (const col of s.columns) {
        if (col.items) for (const [n, v] of col.items) c.xpBase[traitKey(s, col, n)] = v;
        if (col.title === "Gifts") c.xpBase.gifts = col.list.slice();
      }
    }
  }

  // ---------- rendering ----------

  function esc(s) {
    return String(s).replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
  }

  function dots(value, max, path) {
    let out = "";
    for (let i = 1; i <= max; i++) {
      out += `<span class="dot${i <= value ? " on" : ""}" data-dot="${path}.${i}" title="Set to ${i}"></span>`;
    }
    return `<span class="dots" aria-label="${value} of ${max}">${out}</span>`;
  }

  function boxes(n) {
    return `<span class="boxes">${'<span class="box"></span>'.repeat(n)}</span>`;
  }

  function addSelect(path, groups, allowCustom, label) {
    let html = `<select class="add no-print" data-add="${path}"><option value="">+ ${esc(label)}&hellip;</option>`;
    for (const g of groups) {
      if (!g.options.length) continue;
      if (g.group) html += `<optgroup label="${esc(g.group)}">`;
      html += g.options.map((o) => `<option value="${esc(o)}">${esc(o)}</option>`).join("");
      if (g.group) html += `</optgroup>`;
    }
    if (allowCustom) html += `<option value="__custom">Type my own&hellip;</option>`;
    return html + `</select>`;
  }

  function renderColumn(col, si, ci) {
    const path = `${si}.${ci}`;
    let html = `<div class="col"><h3>${esc(col.title)}</h3>`;
    if (col.items) {
      if (!col.items.length) html += `<p class="empty">None</p>`;
      col.items.forEach(([name, value, max], ii) => {
        const remove = col.removable ? `<button class="remove no-print" data-remove="${path}.${ii}" title="Remove">&times;</button>` : "";
        html += `<div class="trait${value ? "" : " zero"}"><span class="trait-name">${remove}${esc(name)}</span>${dots(value, max, `${path}.${ii}`)}</div>`;
      });
      const have = col.items.map((x) => x[0]);
      const options = (col.addOptions || []).filter((o) => !have.includes(o));
      if (options.length || col.allowCustom) html += addSelect(path, [{ options }], col.allowCustom, col.addLabel || "Add");
    }
    if (col.boxes) html += `<div class="trait"><span class="trait-name">Current</span>${boxes(col.boxes)}</div>`;
    if (col.text) html += `<p class="col-text">${esc(col.text)}</p>`;
    if (col.list) {
      html += col.list.length
        ? `<ul>${col.list.map((x, ii) => `<li><button class="remove no-print" data-remove="${path}.${ii}" title="Remove">&times;</button>${esc(x)}</li>`).join("")}</ul>`
        : `<p class="empty">None</p>`;
      if (col.listOptions || col.allowCustom) {
        const groups = (col.listOptions || []).map((g) => ({ group: g.group, options: g.options.filter((o) => !col.list.includes(o)) }));
        html += addSelect(path, groups, col.allowCustom, col.addLabel || "Add");
      }
    }
    return html + "</div>";
  }

  // The points box shown while a player builds a character.
  function renderBudget(c) {
    const r = c.build.result;
    const chip = (name, have, of) => {
      const cls = have === of ? "ok" : have < of ? "left" : "over";
      const tail = have === of ? " ✓" : have < of ? ` — ${of - have} left` : ` — ${have - of} extra (freebies)`;
      return `<span class="chip ${cls}">${esc(name)} ${have}/${of}${tail}</span>`;
    };
    let html = `<div class="budget no-print"><h2>Character Creation Points</h2>`;
    for (const row of r.rows) {
      html += `<div class="brow"><strong>${esc(row.title)}</strong> ${row.parts.map((p) => chip(row.parts.length > 1 ? p.name : "", p.have, p.of)).join(" ")}`;
      if (row.hint) html += `<div class="bhint">${esc(row.hint)}</div>`;
      html += `</div>`;
    }
    const left = r.total - r.used;
    const cls = left === 0 ? "ok" : left > 0 ? "left" : "over";
    html += `<div class="brow"><strong>Freebie points</strong> <span class="chip ${cls}">${r.used} of ${r.total} used${left > 0 ? ` — ${left} left` : left < 0 ? ` — ${-left} too many` : " ✓"}</span>`;
    if (r.flawBonus) html += ` <span class="bhint">(includes ${r.flawBonus} from Flaws)</span>`;
    html += `<div class="bhint">${esc(r.costText)}</div>`;
    if (r.freebieUse.length) html += `<div class="bhint">Spent on: ${esc(r.freebieUse.map((x) => `${x.what} (${x.cost})`).join(", "))}</div>`;
    html += `</div>`;
    if (r.warnings.length) html += `<ul class="warnings">${r.warnings.map((w) => `<li>${esc(w)}</li>`).join("")}</ul>`;
    html += `<div class="bbuttons"><button data-action="fill">Fill the rest randomly</button> <button data-action="finish" class="primary">Finish character</button></div>`;
    return html + `</div>`;
  }

  function renderXp(c) {
    const t = xpTotals(c);
    let html = `<section class="xp"><h2>Experience</h2>`;
    html += `<p class="xp-totals"><strong>Earned:</strong> ${t.earned} &nbsp; <strong>Spent:</strong> ${t.spent} &nbsp; <strong>Unspent:</strong> <span class="${t.left < 0 ? "warn" : ""}">${t.left}</span></p>`;
    html += `<div class="xp-add no-print">
      <input type="number" id="xp-amount" min="1" max="999" placeholder="XP" aria-label="Experience points to add">
      <input type="text" id="xp-note" placeholder="What for? (e.g. Session 3)" aria-label="Reason">
      <button data-action="xp-add" class="primary">Add experience</button>
      <label class="xp-free"><input type="checkbox" data-action="free-edit"${c.freeEdit ? " checked" : ""}> Fix mistakes without spending XP</label>
    </div>`;
    const xpText = (c.build && c.build.xpText) || "Attribute = current × 4, Ability = current × 2 (new: 3), Gift = Level × 3 (other lists: × 5), Rage = current, Gnosis = current × 2, Willpower = current, Background = current × 3 (new: 3, with the Storyteller's OK).";
    html += `<p class="bhint no-print">Click a dot to raise a rating with experience: ${esc(xpText)} Lowering a dot you bought gives the XP back.</p>`;
    const log = c.xp.log;
    if (log.length) {
      html += `<ul class="xp-log">${log
        .map((e, i) => {
          const rm = e.type === "earn" ? `<button class="remove no-print" data-xp-remove="${i}" title="Remove">&times;</button>` : "";
          const amount = e.type === "earn" ? `+${e.xp}` : e.xp < 0 ? `+${-e.xp} back` : `−${e.xp}`;
          return `<li>${rm}<strong>${esc(amount)}</strong> ${esc(e.what)}</li>`;
        })
        .join("")}</ul>`;
    } else html += `<p class="empty">No experience recorded yet.</p>`;
    return html + `</section>`;
  }

  function renderSheet(c, game) {
    let html = `<div class="sheet-title"><h1>${esc(c.game)}</h1></div>`;
    if (c.stage === "build") {
      html += `<p class="hint no-print"><strong>Build your character:</strong> type a name and concept, click dots to spend points, and use the <strong>+ Add</strong> boxes for Backgrounds, Gifts, Merits and Flaws. The box below keeps count. When everything is spent, click <strong>Finish character</strong>.</p>`;
      html += renderBudget(c);
    } else if (c.stage === "play") {
      html += `<p class="hint no-print"><strong>Experience mode:</strong> clicking a dot up spends experience points (see the Experience box at the bottom). Tick "Fix mistakes without spending XP" to edit freely.</p>`;
    } else {
      html += `<p class="hint no-print">Click any dot to change a rating (click the last filled dot to lower it). Click a name below to type over it. Use the <strong>+ Add</strong> boxes to add Gifts, Backgrounds, Merits, Flaws or your own entries.</p>`;
    }

    html += `<div class="header-grid">`;
    const bound = Object.fromEntries(Object.entries(c.choiceFields || {}).map(([id, label]) => [label, id]));
    c.header.forEach(([label, value, choices], i) => {
      const opt = game && bound[label] && game.options.find((o) => o.id === bound[label]);
      if (opt && c.choices) {
        // A dropdown: changing it re-applies that choice's starting traits.
        const cur = String(c.choices[opt.id] ?? "");
        html += `<label class="field"><span class="label">${esc(label)}</span><select class="value hsel" data-choice="${esc(opt.id)}">`;
        html += (opt.choicesFor ? opt.choicesFor(c.choices) : opt.choices).map((ch) => `<option value="${esc(ch)}"${String(ch) === cur ? " selected" : ""}>${esc(String(ch) === cur ? value : ch)}</option>`).join("");
        html += `</select></label>`;
        return;
      }
      const list = choices ? ` list="hdr-list-${i}"` : "";
      const ph = !value && (label === "Name" || label === "Concept") && c.stage === "build" ? ` placeholder="type here"` : "";
      html += `<label class="field"><span class="label">${esc(label)}</span><input class="value" data-header="${i}" value="${esc(value)}"${list}${ph}>`;
      if (choices) html += `<datalist id="hdr-list-${i}">${choices.map((o) => `<option value="${esc(o)}">`).join("")}</datalist>`;
      html += `</label>`;
    });
    html += `</div>`;

    c.sections.forEach((s, si) => {
      const cls = s.columns.length === 1 ? "cols one" : s.columns.length === 2 ? "cols two" : "cols";
      html += `<section><h2>${esc(s.title)}</h2><div class="${cls}">${s.columns.map((col, ci) => renderColumn(col, si, ci)).join("")}</div></section>`;
    });

    html += `<section class="split">`;
    if (c.panel) {
      html += `<div><h2>${esc(c.panel.title)}</h2>${c.panel.lines.map((l) => `<p>${l[0] ? `<strong>${esc(l[0])}:</strong> ` : ""}${esc(l[1])}</p>`).join("")}</div>`;
    }
    if (c.table) {
      // Short headings keep wide form tables (up to 7 traits) inside the page.
      const ABBR = { Strength: "Str", Dexterity: "Dex", Stamina: "Sta", Charisma: "Cha", Manipulation: "Man", Appearance: "App", Perception: "Per" };
      html += `<div><h2>${esc(c.table.title)}</h2><table class="forms"><thead><tr>${c.table.columns.map((x) => `<th title="${esc(x)}">${esc(ABBR[x] || x)}</th>`).join("")}</tr></thead><tbody>`;
      for (const row of c.table.rows) {
        html += `<tr>${c.table.columns.map((x) => `<td>${esc(row[x])}</td>`).join("")}</tr>`;
      }
      html += `</tbody></table></div>`;
    }
    if (c.health) {
      html += `<div><h2>Health</h2><table class="health">`;
      for (const [lvl, pen] of c.health) html += `<tr><td>${esc(lvl)}</td><td>${esc(pen)}</td><td><span class="box"></span></td></tr>`;
      html += `</table></div>`;
    }
    html += `</section>`;

    html += `<section><h2>Notes</h2>`;
    for (const e of c.extras || []) html += `<p><strong>${esc(e.title)}:</strong> ${esc(e.text)}</p>`;
    if (c.freebies) {
      const label = c.mode === "pc" ? "Freebie points" : "Freebie points when generated";
      html += `<p><strong>${label} (${esc(c.freebies.total)}):</strong> ${esc(c.freebies.spent.join(", ") || "none")}</p>`;
    }
    for (const n of c.notes || []) html += `<p>${esc(n)}</p>`;
    if (c.sources && c.sources.length) html += `<p><strong>Supplements used:</strong> ${esc(c.sources.join("; "))}</p>`;
    if (c.edited && c.mode !== "pc") html += `<p><em>Edited by hand after generating.</em></p>`;
    html += `</section>`;

    if (c.xp && c.stage === "play") html += renderXp(c);
    if (c.stage === "play" && c.mode === "pc" && !c.xp.log.some((e) => e.type === "spend")) {
      html += `<p class="no-print"><button data-action="unfinish">Back to character creation</button></p>`;
    }
    if (!c.stage) html += `<p class="no-print"><button data-action="track-xp">Track experience points for this character</button></p>`;
    return html;
  }

  // ---------- page wiring ----------

  function init() {
    const gameSel = document.getElementById("game");
    const modeSel = document.getElementById("mode");
    const optsBox = document.getElementById("options");
    const sheet = document.getElementById("sheet");
    const genBtn = document.getElementById("generate");
    const fileInput = document.getElementById("open-file");
    let character = null;

    games.forEach((g, i) => gameSel.add(new Option(g.label, String(i))));
    // index.html?game=bastet opens one game; &mode=player opens the player build.
    const params = new URLSearchParams(location.search);
    const wantedIndex = games.findIndex((g) => g.id === params.get("game"));
    if (wantedIndex >= 0) gameSel.value = String(wantedIndex);
    if (/^(pc|player)$/i.test(params.get("mode") || "")) modeSel.value = "pc";

    const currentGame = () => games[Number(gameSel.value)];
    const isPc = () => modeSel.value === "pc";

    function buildOptions() {
      optsBox.innerHTML = "";
      for (const o of currentGame().options) {
        if (isPc() && (o.id === "meritsFlaws" || o.npcOnly)) continue; // players pick their own
        const label = document.createElement("label");
        label.textContent = o.label + " ";
        let input;
        if (o.type === "number") {
          input = document.createElement("input");
          input.type = "number";
          input.min = o.min;
          input.max = o.max;
          input.value = o.default;
          input.className = "num";
        } else {
          input = document.createElement("select");
          if (o.random !== false) input.add(new Option("Random", ""));
          o.choices.forEach((ch) => input.add(new Option(String(ch), String(ch))));
          if (o.default !== undefined) input.value = String(o.default);
        }
        input.id = "opt-" + o.id;
        label.appendChild(input);
        optsBox.appendChild(label);
      }
      genBtn.textContent = isPc() ? "Start new character" : "Generate";
    }

    function save() {
      try {
        localStorage.setItem(SAVE_KEY, JSON.stringify({ game: currentGame().id, character }));
      } catch (e) {
        /* private window or storage full: the sheet still works */
      }
    }

    function draw() {
      if (character.stage === "build") WOD.fera.budget(character);
      sheet.innerHTML = renderSheet(character, currentGame());
      document.title = `${character.name || "New character"} — ${currentGame().label}`;
      save();
    }

    function changed() {
      character.edited = true;
      const g = currentGame();
      if (g.recompute) g.recompute(character);
      draw();
    }

    function generate(ask) {
      if (ask && character && character.edited && !confirm("Replace this character? Your changes will be lost (use Save character first to keep it).")) return false;
      const g = currentGame();
      const opts = {};
      for (const o of g.options) {
        const el = document.getElementById("opt-" + o.id);
        const v = el ? el.value : o.default;
        opts[o.id] = o.type === "number" ? Math.max(o.min, Math.min(o.max, Number(v) || 0)) : v;
      }
      if (isPc()) {
        character = g.generate({ ...opts, freebies: 0, meritsFlaws: "No" });
        WOD.fera.blank(character, opts.freebies);
        if (g.recompute) g.recompute(character);
      } else {
        character = g.generate(opts);
        character.mode = "npc";
      }
      character.gameId = g.id;
      draw();
      return true;
    }

    // Load a saved character (from the browser or a file). Returns false if it isn't one.
    function load(data) {
      const i = data && data.character && Array.isArray(data.character.sections) ? games.findIndex((g) => g.id === data.game) : -1;
      if (i < 0) return false;
      gameSel.value = String(i);
      modeSel.value = data.character.mode === "pc" ? "pc" : "npc";
      buildOptions();
      character = data.character;
      character.gameId = data.game;
      draw();
      return true;
    }

    const colAt = (path) => {
      const [si, ci] = path.split(".").map(Number);
      return character.sections[si].columns[ci];
    };
    const charging = () => character.stage === "play" && !character.freeEdit;

    // Experience for a rating change; returns false if the player backs out.
    function payXp(si, ci, name, from, to) {
      if (!charging()) return true;
      const F = WOD.fera;
      const kind = F.traitKind(character, si, ci);
      if (!kind) return true;
      const s = character.sections[si];
      const col = s.columns[ci];
      const key = traitKey(s, col, name);
      const cost = F.xpForChange(kind, from, to, character.xpBase[key] ?? 0, { c: character, name });
      if (!cost) return true;
      const left = xpTotals(character).left;
      if (cost > left && !confirm(`That costs ${cost} XP, but there are only ${left} unspent. Buy it anyway?`)) return false;
      const label = col.title === name || ["Rage", "Gnosis", "Willpower"].includes(col.title) ? col.title : name;
      character.xp.log.push({ type: "spend", xp: cost, what: `${label} ${from} → ${to}${cost < 0 ? " (undone)" : ""}`, key });
      return true;
    }

    function payGift(col, label, adding) {
      if (!charging()) return true;
      if (adding) {
        let cost;
        const group = (col.listOptions || []).find((g) => g.options.includes(label));
        if (group) cost = WOD.fera.giftXp(label, group.own);
        else {
          const typed = prompt("How many experience points does this Gift cost? (Level × 3 for your own Gift lists, Level × 5 for others)", "3");
          if (typed === null) return false;
          cost = Math.max(0, Number(typed) || 0);
        }
        const left = xpTotals(character).left;
        if (cost > left && !confirm(`That Gift costs ${cost} XP, but there are only ${left} unspent. Take it anyway?`)) return false;
        if (cost) character.xp.log.push({ type: "spend", xp: cost, what: `Gift: ${label}`, key: "gift|" + label });
      } else if (!character.xpBase.gifts.includes(label)) {
        const bought = character.xp.log.filter((e) => e.key === "gift|" + label).reduce((s, e) => s + e.xp, 0);
        if (bought > 0) character.xp.log.push({ type: "spend", xp: -bought, what: `Gift removed: ${label}`, key: "gift|" + label });
      }
      return true;
    }

    sheet.addEventListener("click", (e) => {
      const dot = e.target.closest("[data-dot]");
      if (dot) {
        const [si, ci, ii, n] = dot.dataset.dot.split(".").map(Number);
        const item = character.sections[si].columns[ci].items[ii];
        const to = item[1] === n ? n - 1 : n;
        if (!payXp(si, ci, item[0], item[1], to)) return;
        item[1] = to;
        changed();
        return;
      }
      const rm = e.target.closest("[data-remove]");
      if (rm) {
        const [si, ci, ii] = rm.dataset.remove.split(".").map(Number);
        const col = colAt(`${si}.${ci}`);
        if (col.items) {
          if (!payXp(si, ci, col.items[ii][0], col.items[ii][1], 0)) return;
          col.items.splice(ii, 1);
        } else {
          if (col.title === "Gifts" && !payGift(col, col.list[ii], false)) return;
          col.list.splice(ii, 1);
        }
        changed();
        return;
      }
      const xpRm = e.target.closest("[data-xp-remove]");
      if (xpRm) {
        const entry = character.xp.log[Number(xpRm.dataset.xpRemove)];
        if (confirm(`Remove "+${entry.xp} ${entry.what}" from the experience record?`)) {
          character.xp.log.splice(Number(xpRm.dataset.xpRemove), 1);
          draw();
        }
        return;
      }
      const act = e.target.closest("[data-action]");
      if (!act) return;
      const action = act.dataset.action;
      if (action === "fill") {
        WOD.fera.fillRest(character);
        changed();
      } else if (action === "finish") {
        const r = WOD.fera.budget(character);
        const problems = [];
        for (const row of r.rows) for (const p of row.parts) if (p.have < p.of) problems.push(`${row.title}${row.parts.length > 1 ? " (" + p.name + ")" : ""}: ${p.of - p.have} left`);
        if (r.used < r.total) problems.push(`${r.total - r.used} freebie points left`);
        if (r.used > r.total) problems.push(`${r.used - r.total} freebie points too many`);
        problems.push(...r.warnings);
        if (!character.name) problems.push("no name yet");
        if (problems.length && !confirm(`Finish anyway?\n\n• ${problems.join("\n• ")}`)) return;
        character.freebies = { total: String(r.total), spent: r.freebieUse.map((x) => `${x.what} (${WOD.fera.pts(x.cost)})`) };
        startXp(character);
        draw();
      } else if (action === "unfinish") {
        character.stage = "build";
        character.freebies = null;
        draw();
      } else if (action === "track-xp") {
        startXp(character);
        draw();
      } else if (action === "xp-add") {
        const amount = Math.floor(Number(document.getElementById("xp-amount").value));
        if (!(amount > 0)) {
          alert("Type how many experience points to add first.");
          return;
        }
        const note = document.getElementById("xp-note").value.trim() || "Experience";
        character.xp.log.push({ type: "earn", xp: amount, what: note, date: new Date().toISOString().slice(0, 10) });
        draw();
      }
    });

    // Breed, auspice, tribe (etc.) changed on the sheet: make two blank templates, one
    // with the old choice and one with the new, and move the character by the difference
    // so starting Rage/Gnosis/Willpower, free dots, Gift lists, Renown and forms follow
    // while everything the player picked or bought stays.
    function changeChoice(id, value) {
      const g = currentGame();
      const c = character;
      const quiet = { freebies: 0, meritsFlaws: "No" };
      const next = { ...c.choices, [id]: id === "rank" ? Number(value) : value };
      const before = g.generate({ ...c.choices, ...quiet });
      const after = g.generate({ ...next, ...quiet });
      const cols = (ch) => ch.sections.flatMap((s) => s.columns);
      const col = (ch, title) => cols(ch).find((x) => x.title.split(" (")[0] === title || x.title.startsWith(title));
      const clamp = (v, max) => Math.max(0, Math.min(max, v));

      for (const [, label] of Object.entries(after.choiceFields || {})) {
        const h = c.header.find((x) => x[0] === label);
        const t = after.header.find((x) => x[0] === label);
        if (h && t) h[1] = t[1];
      }
      // Single ratings that come from the choices (Rage, Gnosis, Willpower, Humanity...).
      // (choiceAdv: the ratings a game's choices actually set; Vampire's come from Virtues instead.)
      const advNames = (after.build && (after.build.choiceAdv || after.build.advKinds)) || ["Rage", "Gnosis", "Willpower"];
      for (const k of advNames) {
        const a = col(after, k), b0 = col(before, k), mine = col(c, k);
        if (!a || !b0 || !mine || !mine.items) continue;
        const delta = a.items[0][1] - b0.items[0][1];
        mine.items[0][1] = clamp(mine.items[0][1] + delta, mine.items[0][2]);
        if (c.build && c.build.adv && k in c.build.adv) c.build.adv[k] += delta;
      }
      // Free Ability dots and Background dots that come with a breed or group.
      const shift = (title, oldMap, newMap, addIfMissing) => {
        for (const n of new Set([...Object.keys(oldMap || {}), ...Object.keys(newMap || {})])) {
          const d = ((newMap || {})[n] || 0) - ((oldMap || {})[n] || 0);
          if (!d) continue;
          const section = c.sections.find((s) => s.title === title);
          const holder = section ? section.columns.find((x) => x.items.some((it) => it[0] === n)) : col(c, title);
          const it = holder && holder.items.find((x) => x[0] === n);
          if (it) it[1] = clamp(it[1] + d, it[2]);
          else if (addIfMissing && d > 0) col(c, title).items.push([n, d, 5]);
        }
      };
      shift("Abilities", before.build.freeAbil, after.build.freeAbil, false);
      shift("Backgrounds", before.build.bgStart, after.build.bgStart, true);
      // Point pools whose items depend on the choice (e.g. clan Disciplines).
      for (const pool of after.build.pools || []) {
        const mine = col(c, pool.column);
        const theirs = col(after, pool.column);
        if (!mine || !theirs) continue;
        mine.items = [...mine.items.filter((it) => it[1] > 0 || theirs.items.some((x) => x[0] === it[0])), ...theirs.items.filter((x) => !mine.items.some((it) => it[0] === x[0])).map((x) => [x[0], 0, x[2]])];
        if (theirs.addOptions) mine.addOptions = theirs.addOptions;
      }
      // Lists and tables that simply follow the choice; free Gifts follow it too.
      const gifts = col(c, "Gifts");
      if (gifts) {
        const theirs = col(after, "Gifts");
        gifts.listOptions = theirs.listOptions;
        const oldFree = before.build.keepGifts || [];
        const newFree = after.build.keepGifts || [];
        const isFree = (l, names) => names.some((n) => l.startsWith(n + " ("));
        gifts.list = gifts.list.filter((l) => !isFree(l, oldFree) || isFree(l, newFree));
        for (const l of theirs.list) if (isFree(l, newFree) && !gifts.list.some((x) => x.split(" (")[0] === l.split(" (")[0])) gifts.list.unshift(l);
      }
      const renown = col(c, "Renown");
      if (renown) Object.assign(renown, JSON.parse(JSON.stringify(col(after, "Renown"))));
      for (const k of ["table", "panel", "extras", "selection", "choices", "choiceFields"]) if (k in after) c[k] = after[k];
      c.notes = after.notes.filter((n) => !(c.mode === "pc" && n.includes("left over")));
      for (const x of cols(after)) {
        if (x.text && col(c, x.title.split(" (")[0])) col(c, x.title.split(" (")[0]).text = x.text;
        if (x.boxes && col(c, x.title)) col(c, x.title).boxes = x.boxes;
      }
      const keep = { freebies: c.build.freebies, adv: c.build.adv, result: c.build.result };
      const kept = gifts ? gifts.list.filter((l) => (after.build.keepGifts || []).some((n) => l.startsWith(n + " ("))).length : 0;
      c.build = { ...after.build, ...keep };
      if (gifts) c.build.giftAllowance = col(after, "Gifts").list.length - kept;
      if (c.mode !== "pc") delete c.build.adv;
      changed();
    }

    sheet.addEventListener("change", (e) => {
      const choice = e.target.closest("[data-choice]");
      if (choice) {
        changeChoice(choice.dataset.choice, choice.value);
        return;
      }
      const free = e.target.closest('[data-action="free-edit"]');
      if (free) {
        character.freeEdit = free.checked;
        draw();
        return;
      }
      const sel = e.target.closest("[data-add]");
      if (!sel || !sel.value) return;
      const [si, ci] = sel.dataset.add.split(".").map(Number);
      const col = colAt(sel.dataset.add);
      let value = sel.value;
      if (value === "__custom") {
        value = (prompt(col.customPrompt || "Type the name:") || "").trim();
        if (!value) { sel.value = ""; return; }
      }
      // Merits and Flaws with a range of costs ("1-5 pts", "2 or 4 pts"): ask which.
      const range = value.match(/\((\d+)\s*(?:-|–|or)\s*(\d+) pts?/);
      if (range) {
        const pick = prompt(`How many points for ${value.split(" (")[0]}? (${range[1]} to ${range[2]})`, range[1]);
        const n = Math.round(Number(pick));
        if (pick === null || !(n >= Number(range[1]) && n <= Number(range[2]))) { sel.value = ""; return; }
        value = value.replace(range[0], `(${n} pt${n === 1 ? "" : "s"}`);
      }
      if (col.items) {
        if (!payXp(si, ci, value, 0, 1)) { sel.value = ""; return; }
        col.items.push([value, 1, col.addMax || 5]);
      } else {
        if (col.title === "Gifts" && !payGift(col, value, true)) { sel.value = ""; return; }
        col.list.push(value);
      }
      changed();
    });

    sheet.addEventListener("input", (e) => {
      const f = e.target.closest("[data-header]");
      if (!f) return;
      character.header[Number(f.dataset.header)][1] = f.value;
      if (f.dataset.header === "0") {
        character.name = f.value;
        document.title = `${f.value || "New character"} — ${currentGame().label}`;
      }
      character.edited = true;
      save();
    });

    gameSel.addEventListener("change", () => {
      buildOptions();
      if (!generate(true)) {
        gameSel.value = String(Math.max(0, games.findIndex((g) => g.id === character.gameId)));
        buildOptions();
      }
    });
    modeSel.addEventListener("change", () => {
      buildOptions();
      if (!generate(true)) {
        modeSel.value = character.mode === "pc" ? "pc" : "npc";
        buildOptions();
      }
    });
    genBtn.addEventListener("click", () => generate(true));
    document.getElementById("print").addEventListener("click", () => window.print());

    document.getElementById("save").addEventListener("click", () => {
      const data = JSON.stringify({ app: "wod-character-generator", version: 1, game: currentGame().id, character }, null, 1);
      const a = document.createElement("a");
      a.href = URL.createObjectURL(new Blob([data], { type: "application/json" }));
      a.download = `${(character.name || "character").replace(/[^\w\- ]+/g, "").trim() || "character"} (${currentGame().id}).json`;
      document.body.appendChild(a);
      a.click();
      setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 1000);
    });
    document.getElementById("open").addEventListener("click", () => fileInput.click());
    fileInput.addEventListener("change", () => {
      const file = fileInput.files[0];
      fileInput.value = "";
      if (!file) return;
      if (character && character.edited && !confirm("Open this file and replace the character on screen?")) return;
      file.text().then((text) => {
        let data = null;
        try { data = JSON.parse(text); } catch (err) { /* handled below */ }
        if (!load(data)) alert("That file isn't a saved character from this generator.");
      });
    });

    // Bring back the last character (handy if the page was closed by accident).
    let restored = false;
    if (!params.get("game") && !params.get("mode")) {
      try {
        restored = load(JSON.parse(localStorage.getItem(SAVE_KEY) || "null"));
      } catch (e) {
        restored = false;
      }
    }
    if (!restored) {
      buildOptions();
      generate(false);
    }
  }

  return { random, registerGame, renderSheet, init, games, startXp, xpTotals };
})();

</script>
  <script>
/*
  Shared building blocks for the shapeshifter games (Werewolf, Bastet, Mokole...).
  Each game file keeps its own data and decides how to combine these steps.
*/
WOD.fera = (function () {
  const R = WOD.random;

  const ATTRIBUTES = {
    Physical: ["Strength", "Dexterity", "Stamina"],
    Social: ["Charisma", "Manipulation", "Appearance"],
    Mental: ["Perception", "Intelligence", "Wits"],
  };
  const ABILITIES = {
    Talents: ["Alertness", "Athletics", "Brawl", "Dodge", "Empathy", "Expression", "Intimidation", "Primal-Urge", "Streetwise", "Subterfuge"],
    Skills: ["Animal Ken", "Crafts", "Drive", "Etiquette", "Firearms", "Leadership", "Melee", "Performance", "Stealth", "Survival"],
    Knowledges: ["Computer", "Enigmas", "Investigation", "Law", "Linguistics", "Medicine", "Occult", "Politics", "Rituals", "Science"],
  };
  const ARCHETYPES = ["Architect", "Autocrat", "Bon Vivant", "Bravo", "Caregiver", "Celebrant", "Competitor", "Conformist", "Conniver", "Curmudgeon", "Deviant", "Director", "Fanatic", "Gallant", "Judge", "Loner", "Martyr", "Masochist", "Monster", "Penitent", "Perfectionist", "Rebel", "Rogue", "Survivor", "Thrill-Seeker", "Traditionalist", "Visionary"];
  const HEALTH = [["Bruised", ""], ["Hurt", "-1"], ["Injured", "-1"], ["Wounded", "-2"], ["Mauled", "-2"], ["Crippled", "-5"], ["Incapacitated", ""]];
  const COSTS = { Attribute: 5, Ability: 2, Background: 1, Gift: 7, Rage: 1, Gnosis: 2, Willpower: 1 };
  const PRIORITY = ["Primary", "Secondary", "Tertiary"];

  const pts = (n) => `${n} pt${n === 1 ? "" : "s"}`;

  // ---- Gifts. A gift set is { core: { level: [names] }, extra: { book: { level: [names] } } }.
  const G = (core, extra = {}) => ({ core, extra });

  function giftEntries(set, coreOnly) {
    const out = [];
    if (!set) return out;
    for (const [lvl, names] of Object.entries(set.core || {})) for (const n of names) out.push({ name: n, level: Number(lvl), book: "Core" });
    if (!coreOnly) {
      for (const [book, byLevel] of Object.entries(set.extra || {})) {
        for (const [lvl, names] of Object.entries(byLevel)) for (const n of names) out.push({ name: n, level: Number(lvl), book });
      }
    }
    return out;
  }

  const giftLabel = (g) => `${g.name} (${g.source}, L${g.level}${g.book === "Core" ? "" : ", " + g.book})`;
  const mfLabel = ([name, cost, book]) => `${name} (${pts(cost)}${book === "Core" ? "" : ", " + book})`;

  // sources: [[giftSet, sourceLabel], ...]; returns a helper to draw Gifts without repeats.
  function giftPicker(sources, coreOnly) {
    const gifts = [];
    const available = (level) =>
      sources.flatMap(([set, source]) => giftEntries(set, coreOnly).filter((g) => g.level === level).map((g) => ({ ...g, source })))
        .filter((g) => !gifts.some((x) => x.name === g.name));
    return {
      gifts,
      available,
      // Take one Gift of `level` from one specific source (or any source if null).
      take(level, onlySource) {
        const pool = available(level).filter((g) => !onlySource || g.source === onlySource);
        if (!pool.length) return null;
        const g = R.pick(pool);
        gifts.push(g);
        return g;
      },
    };
  }

  // "+ Add Gift" choices: the character's own sources first, then everything else.
  function giftOptions(own, others) {
    const groups = [];
    const seen = new Set();
    const add = (title, source, set, isOwn) => {
      const options = giftEntries(set, false)
        .sort((x, y) => x.level - y.level || x.name.localeCompare(y.name))
        .map((g) => giftLabel({ ...g, source }))
        .filter((l) => !seen.has(l) && seen.add(l));
      if (options.length) groups.push({ group: title, options, own: isOwn, source });
    };
    for (const [title, source, set] of own) add(title, source, set, true);
    for (const [title, source, set] of others) add(title, source, set, false);
    return groups;
  }

  // ---- Gender and names. names = { female: [...], male: [...], last: [...] }
  const pickGender = (opts) => (opts.gender === "Female" || opts.gender === "Male" ? opts.gender : R.pick(["Female", "Male"]));
  const firstName = (names, gender) => R.pick(names[gender.toLowerCase()] || [...(names.female || []), ...(names.male || [])]);

  // ---- Core traits.
  function attributes() {
    const attrs = {};
    const priority = {};
    R.shuffle(Object.keys(ATTRIBUTES)).forEach((cat, i) => {
      priority[cat] = PRIORITY[i];
      ATTRIBUTES[cat].forEach((n) => (attrs[n] = 1));
      R.distribute(attrs, ATTRIBUTES[cat], [7, 5, 3][i], 5);
    });
    return { attrs, priority };
  }

  function abilities(avoid = [], LIST = ABILITIES) {
    const abil = {};
    const priority = {};
    const ok = (n) => !avoid.includes(n);
    // Pick an order where every category has room for its points (max 3 each);
    // a wolf- or reptile-born character can't put 13 points into four Knowledges.
    const room = (cat) => LIST[cat].filter(ok).length * 3;
    let order;
    for (let tries = 0; tries < 50; tries++) {
      order = R.shuffle(Object.keys(LIST));
      if (order.every((cat, i) => room(cat) >= [13, 9, 5][i])) break;
    }
    order.forEach((cat, i) => {
      const p = [13, 9, 5][i];
      priority[cat] = PRIORITY[i];
      LIST[cat].forEach((n) => (abil[n] = 0));
      const allowed = LIST[cat].filter(ok);
      // Focus points on a handful of abilities so characters feel specialized.
      const size = Math.min(allowed.length, Math.max(Math.ceil(p / 3), Math.ceil(p / 2) + 1));
      R.distribute(abil, R.shuffle(allowed).slice(0, size), p, 3);
    });
    return { abil, priority, ok };
  }

  function backgrounds(list, notAllowed = [], mins = {}) {
    const bg = {};
    list.forEach((n) => (bg[n] = 0));
    let points = 5;
    for (const [n, min] of Object.entries(mins)) {
      bg[n] = min;
      points -= min;
    }
    const allowed = list.filter((n) => !notAllowed.includes(n));
    const focus = R.shuffle(allowed).slice(0, R.int(2, 3));
    Object.keys(mins).forEach((n) => focus.includes(n) || focus.push(n));
    R.distribute(bg, focus, points, 5);
    return { bg, allowed };
  }

  function renown(names, need) {
    const r = {};
    names.forEach((n) => (r[n] = 0));
    if (typeof need === "number") R.distribute(r, names, need, 10);
    else Object.assign(r, need);
    return r;
  }

  // Random Merit and/or Flaw. Flaws add freebie points (max 4 at random), Merits cost them.
  function meritsFlaws(data, freebies, rollable, enabled) {
    const merits = [];
    const flaws = [];
    if (enabled) {
      if (R.chance(0.5)) {
        const f = R.pick(data.flaws.filter((x) => typeof x[1] === "number" && x[1] <= 4 && rollable(x)));
        if (f) { flaws.push(f); freebies += f[1]; }
      }
      if (R.chance(0.5)) {
        const m = R.pick(data.merits.filter((x) => typeof x[1] === "number" && x[1] <= Math.min(freebies, 4) && rollable(x)));
        if (m) { merits.push(m); freebies -= m[1]; }
      }
    }
    return { merits, flaws, freebies };
  }

  // Spend freebie points at random. s = { attrs, abil, abilityOk, bg, bgAllowed, adv, picker }
  function spendFreebies(s, points) {
    let left = points;
    const spent = [];
    const canBuy = {
      Attribute: () => Object.keys(s.attrs).filter((k) => s.attrs[k] < 5),
      Ability: () => Object.keys(s.abil).filter((k) => s.abil[k] < 5 && s.abilityOk(k)),
      Background: () => s.bgAllowed.filter((k) => s.bg[k] < 5),
      Gift: () => s.picker.available(1),
      Rage: () => ("Rage" in s.adv && s.adv.Rage < 10 ? ["Rage"] : []),
      Gnosis: () => (s.adv.Gnosis < 10 ? ["Gnosis"] : []),
      Willpower: () => (s.adv.Willpower < 10 ? ["Willpower"] : []),
    };
    const baseWeights = { Ability: 4, Background: 3, Attribute: 2, Rage: 2, Gnosis: 2, Willpower: 2, Gift: 1 };
    while (left > 0) {
      const weights = {};
      for (const [k, w] of Object.entries(baseWeights)) if (COSTS[k] <= left && canBuy[k]().length) weights[k] = w;
      if (!Object.keys(weights).length) break;
      const kind = R.weighted(weights);
      let what;
      if (kind === "Attribute") {
        what = R.pick(canBuy.Attribute());
        s.attrs[what]++;
      } else if (kind === "Ability") {
        const owned = canBuy.Ability().filter((k) => s.abil[k] > 0);
        what = R.pick(owned.length && R.chance(0.7) ? owned : canBuy.Ability());
        s.abil[what]++;
      } else if (kind === "Background") {
        const owned = canBuy.Background().filter((k) => s.bg[k] > 0);
        what = R.pick(owned.length && R.chance(0.7) ? owned : canBuy.Background());
        s.bg[what]++;
      } else if (kind === "Gift") {
        const g = R.pick(canBuy.Gift());
        s.picker.gifts.push(g);
        what = `Gift: ${g.name}`;
      } else {
        s.adv[kind]++;
        what = kind;
      }
      left -= COSTS[kind];
      spent.push({ what, cost: COSTS[kind] });
    }
    // Combine repeats, e.g. "Contacts +2 (2 pts)".
    const rows = [];
    for (const x of spent) {
      const row = rows.find((r) => r.what === x.what);
      if (row) { row.n++; row.cost += x.cost; } else rows.push({ ...x, n: 1 });
    }
    return {
      left,
      spent: rows.map((x) => (x.what.startsWith("Gift: ") ? `${x.what} (${pts(x.cost)})` : `${x.what} +${x.n} (${pts(x.cost)})`)),
    };
  }

  // forms: [{ name, mods: { Trait: n }, zero: [traits set to 0], diff }]
  function formRows(forms, attrs, cols) {
    return forms.map((f) => {
      const row = { Form: f.name };
      cols.forEach((s) => {
        let v = (attrs[s] || 0) + ((f.mods || {})[s] || 0);
        if ((f.zero || []).includes(s)) v = 0;
        row[s] = Math.max(0, v);
      });
      if (f.diff !== undefined) row["Diff."] = f.diff;
      return row;
    });
  }

  function attrsFromSheet(c) {
    const attrs = {};
    const sec = c.sections.find((s) => s.title === "Attributes");
    for (const col of sec.columns) for (const [n, v] of col.items) attrs[n] = v;
    return attrs;
  }

  function groupByCost(list, own) {
    const groups = {};
    for (const mf of list) {
      const key = mf[3] ? `${mf[3]} only` : pts(mf[1]);
      (groups[key] = groups[key] || []).push(mfLabel(mf));
    }
    return Object.entries(groups)
      .sort(([a], [b]) => (a.endsWith("only") - b.endsWith("only")) || (b.startsWith(own) - a.startsWith(own)) || a.localeCompare(b, undefined, { numeric: true }))
      .map(([group, options]) => ({ group, options }));
  }

  // Assemble the standard sheet. p holds everything the game decided.
  function sheet(p) {
    const toItems = (obj, keys, max) => keys.map((k) => [k, obj[k], max]);
    let freebieText = String(p.freebieTotal);
    const flawPts = p.flaws.reduce((s, f) => s + f[1], 0);
    const meritPts = p.merits.reduce((s, m) => s + m[1], 0);
    if (flawPts) freebieText += ` + ${pts(flawPts)} from Flaws`;
    if (meritPts) freebieText += ` − ${pts(meritPts)} on Merits`;
    const notes = [...(p.notes || [])];
    if (p.leftover > 0) notes.push(`${pts(p.leftover)} of freebie points left over: everything that could be raised is already at maximum.`);
    const used = new Set([...p.gifts.map((g) => g.book), ...p.merits.map((m) => m[2]), ...p.flaws.map((f) => f[2])]);
    used.delete("Core");

    const sections = [
      { title: "Attributes", columns: Object.keys(ATTRIBUTES).map((cat) => ({ title: `${cat} (${p.attrPriority[cat]})`, items: toItems(p.attrs, ATTRIBUTES[cat], 5) })) },
      {
        title: "Abilities",
        columns: Object.keys(ABILITIES).map((cat) => ({
          title: `${cat} (${p.abilPriority[cat]})`,
          items: [...toItems(p.abil, ABILITIES[cat], 5), ...Object.entries((p.extraAbil || {})[cat] || {}).map(([n, v]) => [n, v, 5])],
          allowCustom: true,
          addLabel: `Add ${cat.replace(/s$/, "").toLowerCase()}`,
          customPrompt: `Name of the new ${cat.replace(/s$/, "").toLowerCase()}:`,
        })),
      },
      {
        title: "Advantages",
        columns: [
          { title: "Backgrounds", items: p.bgList.filter((n) => p.bg[n] > 0).map((n) => [n, p.bg[n], 5]), removable: true, addOptions: p.bgList, allowCustom: true, addLabel: "Add background", customPrompt: "Name of the background:" },
          { title: "Gifts", list: p.gifts.sort((x, y) => x.level - y.level).map(giftLabel), listOptions: p.giftOptions, allowCustom: true, addLabel: "Add Gift", customPrompt: "Gift name, and its source and level if you like:" },
          { title: `Renown — Rank ${p.rank}`, items: toItems(p.renown, Object.keys(p.renown), 10) },
        ],
      },
    ];
    if (p.extraColumns) sections.push(...p.extraColumns);
    sections.push(
      {
        title: "Merits & Flaws",
        columns: [
          { title: "Merits", list: p.merits.map(mfLabel), listOptions: groupByCost(p.mfData.merits, p.mfOwn), allowCustom: true, addLabel: "Add Merit", customPrompt: "Merit name and cost, e.g. Iron Will (5 pts):" },
          { title: "Flaws", list: p.flaws.map(mfLabel), listOptions: groupByCost(p.mfData.flaws, p.mfOwn), allowCustom: true, addLabel: "Add Flaw", customPrompt: "Flaw name and value, e.g. Phobia (1 pt):" },
        ],
      },
      {
        title: Object.keys(p.adv).join(", ").replace(/, ([^,]*)$/, " & $1"),
        columns: Object.keys(p.adv).map((k) => ({ title: k, items: [["Permanent", p.adv[k], 10]], boxes: 10 })),
      }
    );

    // What a player-built character starts from (see blank() and budget() below).
    const b = p.build || {};
    const build = {
      rank: p.rank,
      avoid: b.avoid || [],
      noBg: b.noBg || [],
      bgStart: b.bgStart || {},
      bgFree: 5 - Object.values(b.bgMin || {}).reduce((s, x) => s + x, 0),
      freeAbil: b.freeAbil || {},
      keepGifts: b.keepGifts || [],
      giftHint: b.giftHint || "",
      maxAppearance: b.maxAppearance || 0,
      ownSources: p.giftOptions.filter((g) => g.own).map((g) => g.source),
    };

    return {
      game: p.game,
      name: p.name,
      header: p.header,
      sections,
      table: { title: "Forms", columns: p.formColumns, rows: p.formRows },
      health: HEALTH,
      extras: p.extras || [],
      freebies: { total: freebieText, spent: p.spent },
      notes,
      sources: [...used].map((k) => `${k} = ${p.books[k] || k}`),
      build,
    };
  }

  // ---------------------------------------------------------------------------
  // Player characters, for any game. A game makes a character with 0 freebies and
  // no Merits or Flaws; blank() then clears the random choices so the player picks
  // everything, and budget() counts what they have spent against the creation rules.
  // c.build is plain data (it is saved with the character):
  //   costs       freebie cost of each kind (Attribute, Ability, Background, Gift, Rage, Discipline...)
  //   advKinds    single-rating columns with a starting value (Rage, Gnosis, Willpower / Humanity...)
  //   adv         those starting values
  //   pools       extra point pools: [{ title, column, kind, size, startAll, start: {name: n}, fillCap, hint }]
  //   attrStart   Attributes that don't start at 1;  attrMax  Attributes with a lower limit
  //   avoid, noBg, bgStart, bgFree, freeAbil, rank, and for Gifts: keepGifts, giftAllowance, giftHint, ownSources
  //   costText, xpText   explanations shown to the player
  const DEFAULT_ADV = ["Rage", "Gnosis", "Willpower"];
  const DEFAULT_COST_TEXT = "Costs: Attribute 5 · Ability 2 · Background 1 · Gift 7 · Rage 1 · Gnosis 2 · Willpower 1 · Merits cost their points · Flaws give up to 7.";
  const secBy = (c, title) => c.sections.find((s) => s.title === title);
  const colBy = (c, title) => c.sections.flatMap((s) => s.columns).find((col) => col.title === title);
  const advKinds = (c) => c.build.advKinds || DEFAULT_ADV;
  const advCols = (c) => c.sections.flatMap((s) => s.columns).filter((col) => advKinds(c).includes(col.title) && col.items);
  const costsOf = (c) => c.build.costs || COSTS;
  const attrStart = (b, n) => (b.attrStart || {})[n] ?? 1;
  const attrMax = (b, n) => (b.attrMax || {})[n] ?? (n === "Appearance" && b.maxAppearance ? b.maxAppearance : 5);
  const poolStart = (p, n) => (p.start || {})[n] ?? p.startAll ?? 0;
  const costOf = (label) => Number((String(label).match(/\((\d+) pts?\b/) || [0, 0])[1]);
  const giftLevel = (label) => Number((String(label).match(/, L(\d)/) || [0, 1])[1]);
  const giftSource = (label) => (String(label).match(/\(([^,()]+), L\d/) || [0, ""])[1];

  function blank(c, freebies) {
    const b = c.build;
    c.mode = "pc";
    c.stage = "build";
    b.freebies = freebies;
    b.adv = Object.fromEntries(advCols(c).map((col) => [col.title, col.items[0][1]]));
    for (const col of secBy(c, "Attributes").columns) col.items.forEach((it) => (it[1] = attrStart(b, it[0])));
    for (const col of secBy(c, "Abilities").columns) col.items.forEach((it) => (it[1] = b.freeAbil[it[0]] || 0));
    colBy(c, "Backgrounds").items = Object.entries(b.bgStart).filter(([, v]) => v > 0).map(([n, v]) => [n, v, 5]);
    for (const p of b.pools || []) colBy(c, p.column).items.forEach((it) => (it[1] = poolStart(p, it[0])));
    const gifts = colBy(c, "Gifts");
    if (gifts) {
      const kept = gifts.list.filter((l) => b.keepGifts.some((n) => l.startsWith(n + " (")));
      b.giftAllowance = gifts.list.length - kept.length;
      gifts.list = kept;
    }
    colBy(c, "Merits").list = [];
    colBy(c, "Flaws").list = [];
    for (const h of c.header) {
      if (["Name", "Concept"].includes(h[0])) h[1] = "";
      if (["Nature", "Demeanor"].includes(h[0])) { h[1] = ""; h[2] = ARCHETYPES; }
    }
    c.name = "";
    c.freebies = null;
    c.notes = c.notes.filter((n) => !n.includes("left over"));
    c.sources = [];
    c.edited = false;
    return c;
  }

  // Match the categories to the priority pools: the most-spent category gets the biggest pool.
  function fitPools(spent, pools) {
    const order = spent.map((s, i) => i).sort((x, y) => spent[y] - spent[x] || x - y);
    const pool = [];
    order.forEach((ci, rank) => (pool[ci] = { size: pools[rank], priority: PRIORITY[rank] }));
    const over = spent.reduce((s, x, i) => s + Math.max(0, x - pool[i].size), 0);
    return { pool, over };
  }

  // Counts points against the creation rules. Returns rows for the points box and
  // updates the Primary/Secondary/Tertiary labels to match how points were spent.
  function budget(c) {
    const b = c.build;
    const C = costsOf(c);
    const rows = [];
    const warnings = [];
    const freebieUse = [];
    const charge = (what, dots, each) => dots > 0 && freebieUse.push({ what: `${what} +${dots}`, cost: dots * each });
    const relabel = (col, pr) => (col.title = `${col.title.split(" (")[0]} (${pr})`);

    // Attributes: 7/5/3 dots above their starting value (normally 1).
    const aCols = secBy(c, "Attributes").columns;
    const aSpent = aCols.map((col) => col.items.reduce((s, [n, v]) => s + Math.max(0, v - attrStart(b, n)), 0));
    const aFit = fitPools(aSpent, [7, 5, 3]);
    aCols.forEach((col, i) => relabel(col, aFit.pool[i].priority));
    rows.push({ title: "Attributes", parts: aCols.map((col, i) => ({ name: col.title.split(" (")[0], have: aSpent[i], of: aFit.pool[i].size })) });
    charge("Attributes", aFit.over, C.Attribute);
    for (const [n, v] of aCols.flatMap((col) => col.items)) if (v > attrMax(b, n)) warnings.push(`${n} can't start above ${attrMax(b, n)} for this character.`);

    // Abilities: 13/9/5, no higher than 3 before freebies.
    const abCols = secBy(c, "Abilities").columns;
    let above3 = 0;
    const abSpent = abCols.map((col) =>
      col.items.reduce((s, [n, v]) => {
        const start = b.freeAbil[n] || 0;
        const cap = Math.max(3, start);
        above3 += Math.max(0, v - cap);
        if (v > start && b.avoid.includes(n)) warnings.push(`${n}: this character can't start with it.`);
        return s + Math.max(0, Math.min(v, cap) - start);
      }, 0)
    );
    const abFit = fitPools(abSpent, [13, 9, 5]);
    abCols.forEach((col, i) => relabel(col, abFit.pool[i].priority));
    rows.push({ title: "Abilities", parts: abCols.map((col, i) => ({ name: col.title.split(" (")[0], have: abSpent[i], of: abFit.pool[i].size })) });
    charge("Abilities", abFit.over + above3, C.Ability);
    if (above3) warnings.push(`Abilities above 3 are paid with freebie points (${above3} dot${above3 === 1 ? "" : "s"}).`);

    // Backgrounds: 5 dots (some groups start with extra dots already filled in).
    const bgItems = colBy(c, "Backgrounds").items;
    const bgSpent = bgItems.reduce((s, [n, v]) => s + Math.max(0, v - (b.bgStart[n] || 0)), 0);
    rows.push({ title: "Backgrounds", parts: [{ name: "Dots", have: bgSpent, of: b.bgFree }] });
    charge("Backgrounds", Math.max(0, bgSpent - b.bgFree), C.Background);
    for (const [n, v] of bgItems) if (v > 0 && b.noBg.includes(n)) warnings.push(`${n}: not allowed for this character.`);
    for (const [n, v] of Object.entries(b.bgStart)) if ((bgItems.find((it) => it[0] === n) || [0, 0])[1] < v) warnings.push(`${n} should be at least ${v}.`);

    // Other pools (Disciplines, Virtues...).
    for (const p of b.pools || []) {
      const items = colBy(c, p.column).items;
      const spent = items.reduce((s, [n, v]) => s + Math.max(0, v - poolStart(p, n)), 0);
      rows.push({ title: p.title, parts: [{ name: "Dots", have: Math.min(spent, p.size), of: p.size }], hint: p.hint });
      charge(p.title, Math.max(0, spent - p.size), C[p.kind]);
      for (const [n, v] of items) if (v < poolStart(p, n)) warnings.push(`${n} starts at ${poolStart(p, n)}; it can't go lower.`);
      if (p.allowed) for (const [n, v] of items) if (v > 0 && !p.allowed.includes(n)) warnings.push(`${n} isn't one of this character's own ${p.title}; it needs the Storyteller's OK.`);
    }

    // Gifts.
    const gCol = colBy(c, "Gifts");
    if (gCol) {
      const gifts = gCol.list;
      const chosen = gifts.length - b.keepGifts.length;
      rows.push({ title: "Gifts", parts: [{ name: "Chosen", have: Math.min(chosen, b.giftAllowance), of: b.giftAllowance }], hint: b.giftHint });
      if (chosen > b.giftAllowance) freebieUse.push({ what: `Extra Gifts ×${chosen - b.giftAllowance}`, cost: (chosen - b.giftAllowance) * C.Gift });
      for (const g of gifts) {
        if (giftLevel(g) > b.rank) warnings.push(`${g.split(" (")[0]} is Level ${giftLevel(g)}, above Rank ${b.rank}.`);
        const src = giftSource(g);
        if (src && b.ownSources.length && !b.ownSources.includes(src)) warnings.push(`${g.split(" (")[0]} comes from ${src}, not one of this character's own Gift lists.`);
      }
    }

    // Rage / Gnosis / Willpower / Humanity above their starting values.
    for (const col of advCols(c)) {
      const k = col.title;
      const v = col.items[0][1];
      const base = b.adv[k] ?? v;
      if (v > base) charge(k, v - base, C[k]);
      if (v < base) warnings.push(`${k} starts at ${base}; it can't go lower at creation.`);
    }

    // Merits cost freebies; Flaws give up to 7 back.
    const meritPts = colBy(c, "Merits").list.reduce((s, x) => s + costOf(x), 0);
    const flawPts = colBy(c, "Flaws").list.reduce((s, x) => s + costOf(x), 0);
    if (meritPts) freebieUse.push({ what: "Merits", cost: meritPts });
    const flawBonus = Math.min(7, flawPts);
    if (flawPts > 7) warnings.push(`Flaws give at most 7 freebie points (yours add up to ${flawPts}).`);

    const total = b.freebies + flawBonus;
    const used = freebieUse.reduce((s, x) => s + x.cost, 0);
    b.result = { rows, warnings, freebieUse, total, used, flawBonus, costText: b.costText || DEFAULT_COST_TEXT };
    return b.result;
  }

  // "Fill the rest randomly": spends whatever creation points are left (not freebies).
  function fillRest(c) {
    const b = c.build;
    const res = budget(c);
    const row = (title) => res.rows.find((r) => r.title === title);
    const spread = (items, points, cap, ok, startOf) => {
      for (let p = 0; p < points; p++) {
        const open = items.filter((it) => it[1] < cap && ok(it[0], it[1]));
        if (!open.length) return;
        const owned = open.filter((it) => it[1] > startOf(it[0]));
        R.pick(owned.length && R.chance(0.6) ? owned : open)[1]++;
      }
    };
    secBy(c, "Attributes").columns.forEach((col, i) => {
      const part = row("Attributes").parts[i];
      spread(col.items, part.of - part.have, 5, (n, v) => v < attrMax(b, n), (n) => attrStart(b, n));
    });
    secBy(c, "Abilities").columns.forEach((col, i) => {
      const part = row("Abilities").parts[i];
      spread(col.items, part.of - part.have, 3, (n) => !b.avoid.includes(n), (n) => b.freeAbil[n] || 0);
    });
    const bgCol = colBy(c, "Backgrounds");
    const bgPart = row("Backgrounds").parts[0];
    for (let p = 0; p < bgPart.of - bgPart.have; p++) {
      const owned = bgCol.items.filter((it) => it[1] < 5);
      if (owned.length && R.chance(0.6)) { R.pick(owned)[1]++; continue; }
      const n = R.pick(bgCol.addOptions.filter((x) => !b.noBg.includes(x) && !bgCol.items.some((it) => it[0] === x && it[1] >= 5)));
      if (!n) break;
      const it = bgCol.items.find((x) => x[0] === n);
      if (it) it[1]++;
      else bgCol.items.push([n, 1, 5]);
    }
    for (const p of b.pools || []) {
      const part = row(p.title).parts[0];
      spread(colBy(c, p.column).items, part.of - part.have, p.fillCap || 5, (n) => !p.allowed || p.allowed.includes(n), (n) => poolStart(p, n));
    }
    // Gifts: one Level 1 from each own list that has none yet, then one per Rank level.
    const gCol = colBy(c, "Gifts");
    if (gCol) {
      const own = gCol.listOptions.filter((g) => g.own);
      const has = (o) => gCol.list.some((x) => x.split(" (")[0] === o.split(" (")[0]);
      const free = (level, src) => own.filter((g) => !src || g.source === src).flatMap((g) => g.options).filter((o) => giftLevel(o) === level && !has(o));
      const need = () => b.giftAllowance - (gCol.list.length - b.keepGifts.length);
      for (let lvl = 2; lvl <= b.rank && need() > 0; lvl++) {
        if (!gCol.list.some((g) => giftLevel(g) === lvl)) { const o = R.pick(free(lvl)); if (o) gCol.list.push(o); }
      }
      for (const src of b.ownSources) {
        if (need() > 0 && !gCol.list.some((g) => giftSource(g) === src)) { const o = R.pick(free(1, src)); if (o) gCol.list.push(o); }
      }
      while (need() > 0) { const o = R.pick(free(1)); if (!o) break; gCol.list.push(o); }
      gCol.list.sort((x, y) => giftLevel(x) - giftLevel(y));
    }
  }

  // ---- Experience. Each step is priced at the rating it starts from ("current rating").
  // Werewolf Revised chart (the Changing Breeds use it too) plus the Vampire kinds.
  const XP_STEP = {
    Attribute: (v) => v * 4,
    Ability: (v) => (v === 0 ? 3 : v * 2),
    Background: (v) => (v === 0 ? 3 : v * 3), // Storyteller's call; not on the Revised charts
    Rage: (v) => v,
    Gnosis: (v) => v * 2,
    Willpower: (v) => v,
    // Vampire: new Discipline 10; then clan × 5, Caitiff × 6, other × 7.
    Discipline: (v, ctx) => (v === 0 ? 10 : v * (ctx.c.build.caitiff ? 6 : (ctx.c.build.clanDisciplines || []).includes(ctx.name) ? 5 : 7)),
    Virtue: (v) => v * 2,
    Humanity: (v) => v * 2,
  };

  function traitKind(c, si, ci) {
    const s = c.sections[si];
    const col = s.columns[ci];
    if (s.title === "Attributes") return "Attribute";
    if (s.title === "Abilities") return "Ability";
    if (col.title === "Backgrounds") return "Background";
    const pool = ((c.build && c.build.pools) || []).find((p) => p.column === col.title);
    if (pool) return pool.kind;
    if (c.build && advKinds(c).includes(col.title)) return col.title;
    if (!c.build && DEFAULT_ADV.includes(col.title)) return col.title;
    return null; // Renown and the like change through play, not experience
  }

  // Cost of moving a rating from `from` to `to` (negative = refund). Steps below the
  // rating the character had when experience tracking began are free.
  function xpForChange(kind, from, to, floor, ctx = {}) {
    const step = XP_STEP[kind];
    if (!step) return 0;
    let cost = 0;
    for (let v = Math.max(from, floor); v < to; v++) cost += step(v, ctx);
    for (let v = Math.max(to, floor); v < from; v++) cost -= step(v, ctx);
    return cost;
  }
  const giftXp = (label, own) => giftLevel(label) * (own ? 3 : 5);

  // ---------------------------------------------------------------------------
  // Data-driven game for the smaller Changing Breeds. cfg fields:
  //   id, label, game, books, general (gift set), startGifts: ["breed","groupA","groupB","general"]
  //   breeds: { Name: { gnosis: n | {Female, Male}, start: [L1 names], gifts: set, avoid: [], noBg: [], free: {Ability: n}, note } }
  //   groupA / groupB: { label, choices: { Name: { rage, willpower, start, gifts, giftsBy: {Female, Male, Metis}, note, bgMin } } }
  //   rage / willpower: number | "breed" | "groupA" | null (no Rage);  gender: true adds a Gender option
  //   renownNames, renownTotals (or null), rankTitles, backgrounds, bgMin, forms(sel) -> [...], formColumns
  //   mfForbidden: Garou Merits/Flaws that don't fit;  names: { first, last, animal };  concepts, animalConcepts
  function mergeSets(...sets) {
    const core = {};
    for (const s of sets) for (const [lvl, names] of Object.entries((s && s.core) || {})) core[lvl] = [...new Set([...(core[lvl] || []), ...names])];
    return { core, extra: {} };
  }
  const valueFor = (v, sel) => (v && typeof v === "object" ? v[sel.breedIsMetis && "Metis" in v ? "Metis" : sel.gender] ?? v.Female : v);

  function simpleGame(cfg) {
    const physSocFor = cfg.formColumns || ["Strength", "Dexterity", "Stamina", "Manipulation", "Appearance"];
    // Make sure every named starting Gift exists in its Level 1 list.
    const addStart = (entry) => {
      if (!entry || !entry.start || !entry.gifts) return;
      const l1 = (entry.gifts.core[1] = entry.gifts.core[1] || []);
      for (const n of entry.start) if (!l1.includes(n)) l1.push(n);
    };
    Object.values(cfg.breeds).forEach(addStart);
    for (const grp of [cfg.groupA, cfg.groupB]) if (grp) Object.values(grp.choices).forEach(addStart);

    function generate(opts) {
      const rank = Math.min(5, Math.max(1, Number(opts.rank) || 1));
      const freebieTotal = Number.isFinite(opts.freebies) ? opts.freebies : 15;
      const breed = opts.breed || R.pick(Object.keys(cfg.breeds));
      const b = cfg.breeds[breed];
      const gender = pickGender(opts);
      const sel = { breed, gender, breedIsMetis: breed === "Metis" };
      const aName = cfg.groupA ? opts.groupA || R.pick(Object.keys(cfg.groupA.choices)) : null;
      const bName = cfg.groupB ? opts.groupB || R.pick(Object.keys(cfg.groupB.choices)) : null;
      const a = aName ? cfg.groupA.choices[aName] : {};
      const g2 = bName ? cfg.groupB.choices[bName] : {};
      const notes = [b.note, a.note, g2.note, cfg.note].filter(Boolean);

      const { attrs, priority: attrPriority } = attributes();
      const { abil, priority: abilPriority, ok: abilityOk } = abilities(b.avoid || []);
      for (const [n, v] of Object.entries({ ...(cfg.free || {}), ...(b.free || {}) })) abil[n] = Math.min(5, (abil[n] || 0) + v);
      const bgMin = { ...(cfg.bgMin || {}), ...(a.bgMin || {}) };
      const { bg, allowed: bgAllowed } = backgrounds(cfg.backgrounds, [...(b.noBg || []), ...(a.noBg || [])], bgMin);
      // Some groups get Background dots on top of the normal 5 (e.g. Knife-Skulkers' Contacts).
      for (const [n, v] of Object.entries(a.bgBonus || {})) bg[n] = Math.min(5, (bg[n] || 0) + v);
      if (b.maxAppearance && attrs.Appearance > b.maxAppearance) {
        notes.push(`${breed} start with Appearance ${b.maxAppearance} at most (lowered from ${attrs.Appearance}).`);
        attrs.Appearance = b.maxAppearance;
      }

      const aGifts = a.giftsBy ? (sel.breedIsMetis ? mergeSets(a.giftsBy.Female, a.giftsBy.Male) : a.giftsBy[gender]) : a.gifts;
      const sources = { breed: [b.gifts, breed], groupA: [aGifts, aName], groupB: [g2.gifts, bName], general: [cfg.general, "General"], extra: cfg.extraSource || [null, null] };
      const used = Object.values(sources).filter(([set, name]) => set && name);
      const picker = giftPicker(used, false);
      for (const key of cfg.startGifts) {
        const [set, name] = sources[key];
        if (!set) continue;
        const start = key === "breed" ? b.start : key === "groupA" ? (a.startBy ? a.startBy[sel.breedIsMetis ? "Metis" : gender] : a.start) : key === "groupB" ? g2.start : null;
        const pool = picker.available(1).filter((g) => g.source === name && (!start || start.includes(g.name)));
        const pick = R.pick(pool.length ? pool : picker.available(1).filter((g) => g.source === name));
        if (pick) picker.gifts.push(pick);
      }
      for (const n of a.freeGifts || []) if (!picker.gifts.some((g) => g.name === n)) picker.gifts.push({ name: n, level: 1, book: "Core", source: aName });
      for (let lvl = 2; lvl <= rank; lvl++) picker.take(lvl, null);

      const pickVal = (rule) => (rule === "breed" ? valueFor(b.gnosisFor || b.rage, sel) : rule === "groupA" ? valueFor(a.rage, sel) : rule);
      const adv = {};
      if (cfg.rage !== null) adv.Rage = cfg.rage === "groupA" ? valueFor(a.rage, sel) : typeof cfg.rage === "number" ? cfg.rage : pickVal(cfg.rage);
      adv.Gnosis = typeof cfg.gnosis === "number" ? cfg.gnosis : valueFor(b.gnosis, sel);
      adv.Willpower = cfg.willpower === "groupA" ? a.willpower : cfg.willpower === "breed" ? b.willpower : cfg.willpower;

      const renown = cfg.renownNames ? renownFn(cfg.renownNames, cfg.renownTotals[rank - 1]) : {};
      if (!cfg.renownNames) notes.push(cfg.renownNote || "This race has no Renown categories.");
      else if (cfg.renownAssumed) notes.push(`Renown needed per Rank isn't given in the book; this uses Garou-style totals (${cfg.renownTotals.join("/")}) in any mix.`);

      const W = window.WEREWOLF_DATA;
      const mfData = { merits: W.merits.filter((x) => !x[3] && !(cfg.mfForbidden || []).includes(x[0])), flaws: W.flaws.filter((x) => !x[3] && !(cfg.mfForbidden || []).includes(x[0])) };
      const rollable = (mf) => !W.randomSkip.includes(mf[0]) && !(b.avoid && W.lupusSkip.includes(mf[0]));
      const mf = meritsFlaws(mfData, freebieTotal, rollable, opts.meritsFlaws !== "No");
      const fr = spendFreebies({ attrs, abil, abilityOk, bg, bgAllowed, adv, picker }, mf.freebies);

      const names = cfg.names;
      const animalBorn = !!b.animal;
      const name = animalBorn ? R.pick(names.animal) : `${firstName(names, gender)} ${R.pick(names.last)}`;
      const header = [["Name", name], ["Player", ""], ["Chronicle", ""], ["Breed", breed]];
      header.push(["Gender", cfg.gender && sel.breedIsMetis ? `${gender} (metis)` : gender]);
      if (aName) header.push([cfg.groupA.label, a.title ? `${aName} (${a.title})` : aName]);
      if (bName) header.push([cfg.groupB.label, bName]);
      header.push(["Nature", R.pick(ARCHETYPES)], ["Demeanor", R.pick(ARCHETYPES)], ["Concept", animalBorn ? R.pick(cfg.animalConcepts) : R.pick(cfg.concepts)]);
      header.push(["Rank", `${rank}${cfg.rankTitles ? ` (${cfg.rankTitles[rank - 1]})` : ""}`]);
      while (header.length % 3) header.push([cfg.extraHeader ? cfg.extraHeader[header.length % cfg.extraHeader.length] : "Notes", ""]);

      const extras = [];
      for (const perk of [a.perk, g2.perk, b.perk].filter(Boolean)) extras.push({ title: perk[0], text: perk[1] });
      if (b.deformity) extras.push({ title: "Metis Deformity", text: R.pick(cfg.deformities || ["Hunchback", "Lame leg", "Missing fingers", "Strange odor", "Twisted limb", "Withered arm"]) });

      const own = used.map(([set, nm]) => [nm === "General" ? "General" : `${nm}`, nm, set]);
      const others = [];
      for (const [label, list] of [["breed", cfg.breeds], [cfg.groupA && cfg.groupA.label.toLowerCase(), cfg.groupA && cfg.groupA.choices], [cfg.groupB && cfg.groupB.label.toLowerCase(), cfg.groupB && cfg.groupB.choices]]) {
        if (!list) continue;
        for (const [n, v] of Object.entries(list)) {
          const set = v.giftsBy ? mergeSets(v.giftsBy.Female, v.giftsBy.Male) : v.gifts;
          if (set && !used.some(([, nm]) => nm === n)) others.push([`${n} (other ${label})`, n, set]);
        }
      }

      const c = sheet({
        game: cfg.game, name, header,
        attrs, attrPriority, abil, abilPriority, extraAbil: b.extraAbil,
        bg, bgList: cfg.backgrounds,
        gifts: picker.gifts, giftOptions: giftOptions(own, others),
        rank, renown,
        merits: mf.merits, flaws: mf.flaws, mfData, mfOwn: "",
        adv,
        formColumns: ["Form", ...physSocFor, ...(cfg.formDiff ? ["Diff."] : [])],
        formRows: formRows(cfg.forms(sel), attrs, physSocFor),
        extras, notes,
        freebieTotal, spent: fr.spent, leftover: fr.left,
        books: cfg.books,
        build: {
          avoid: b.avoid, noBg: [...(b.noBg || []), ...(a.noBg || [])],
          bgMin, bgStart: Object.fromEntries(Object.keys({ ...bgMin, ...(a.bgBonus || {}) }).map((n) => [n, (bgMin[n] || 0) + ((a.bgBonus || {})[n] || 0)])),
          freeAbil: { ...(cfg.free || {}), ...(b.free || {}) },
          keepGifts: a.freeGifts, maxAppearance: b.maxAppearance,
          giftHint: startHint(cfg, b, a, g2, breed, aName, bName, gender, sel) + (rank > 1 ? ` Plus one Gift of each Level from 2 to ${rank}.` : ""),
        },
      });
      c.selection = sel;
      c.choices = { breed, gender, groupA: aName, groupB: bName, rank };
